<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ONEDOPEA</title>
<style>
:root {
  --green: #7dfba4;
  --green-soft: rgba(125, 251, 164, 0.78);
  --green-dim: rgba(125, 251, 164, 0.42);
  --nav-size: clamp(46px, 5.2vw, 66px);
  --nav-offset: clamp(12px, 2.2vw, 30px);
  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  background: #000;
  overflow: hidden;
  user-select: none;
  position: fixed;
  inset: 0;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  font-family: var(--mono);
}
body { transition: filter 0.35s ease; }
body.glitch-mode {
  filter: hue-rotate(180deg) saturate(1.55);
  animation: bodyShake 0.28s infinite linear;
}
body.golden {
  filter: hue-rotate(-72deg) saturate(1.7);
}
@keyframes bodyShake {
  0%, 100% { transform: translate(0, 0); }
  25% { transform: translate(1.5px, -1px); }
  50% { transform: translate(-1.5px, 1px); }
  75% { transform: translate(1px, 1.5px); }
}
canvas { display: block; width: 100%; height: 100%; }

/* CRT glass */
.vignette {
  position: fixed;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  background: radial-gradient(circle at center, transparent 46%, rgba(0, 0, 0, 0.55) 100%);
}
.crt-flicker {
  position: fixed;
  inset: -20%;
  z-index: 110;
  pointer-events: none;
  background: radial-gradient(circle, rgba(125, 251, 164, 0.07), transparent 62%);
  animation: crtFlicker 4s steps(2, end) infinite;
}
@keyframes crtFlicker {
  0%, 100% { opacity: 0.2; }
  50% { opacity: 0.34; }
}
.scanlines {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 120;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px, transparent 2px,
    rgba(0, 0, 0, 0.18) 2px, rgba(0, 0, 0, 0.18) 4px
  );
}

/* ============ ORACLE TITLE ============ */
#oracle-wrap {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 5;
  pointer-events: none;
}
#oracle-wrap::before {
  content: "";
  position: absolute;
  width: 80%;
  height: 40%;
  background: radial-gradient(ellipse, rgba(0, 0, 0, 0.72) 0%, transparent 70%);
}
#oracle-wrap.hidden { visibility: hidden; }
#oracle-wrap.suck { animation: suckContent 1.05s cubic-bezier(0.5, 0, 0.9, 0.4) forwards; }
#oracle {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 0.12em;
  font-family: var(--mono);
  font-size: clamp(29px, 7.7vw, 92px);
  font-weight: 700;
  letter-spacing: 0.12em;
  line-height: 1;
  text-decoration: none;
  cursor: pointer;
  pointer-events: auto;
  text-align: center;
}
#oracle.inactive { pointer-events: none; cursor: default; }
#oracle span {
  display: inline-block;
  min-width: 0.7em;
  text-align: center;
  color: #00c83a;
  text-shadow: 0 0 6px #00ff55;
  opacity: 0;
  will-change: transform, opacity, color;
  transition: color 0.2s, text-shadow 0.2s, opacity 0.18s, transform 0.18s;
}
#oracle span.show { opacity: 1; }
#oracle span.locked {
  color: #d4ffd4;
  text-shadow: 0 0 4px #fff, 0 0 8px #6f6, 0 0 18px #0f0, 0 0 36px #050, 0 0 72px #0a0;
}
#oracle.done { animation: pulse 2.8s ease-in-out infinite; }
#oracle.done:hover span.locked {
  color: #ffffff;
  text-shadow: 0 0 5px #fff, 0 0 12px #9f9, 0 0 28px #0f0, 0 0 55px #0f0;
}
#oracle.onedopea-mode { animation: glitch-skew 0.4s infinite linear alternate-reverse; }
#oracle.onedopea-mode span { text-shadow: 2px 0 #ff00ff, -2px 0 #00ffff; }
#oracle.onedopea-mode span.locked {
  color: #fff;
  text-shadow: 2px 0 #ff00ff, -2px 0 #00ffff, 0 0 10px #0f0, 0 0 20px #0f0, 0 0 40px #0f0;
  animation: glitch-anim 0.15s infinite;
}

/* ============ BOTCONTROL SLIDE ============ */
#slide-wrap {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: grid;
  place-items: center;
  pointer-events: none;
}
#slide-wrap.hidden { visibility: hidden; }
#slide-panel {
  width: min(880px, calc(100vw - 230px));
  min-width: 240px;
  max-height: calc(100dvh - 120px);
  overflow: hidden;
  padding: clamp(24px, 4vw, 52px);
  border-radius: 24px;
  background: linear-gradient(180deg, rgba(6, 14, 9, 0.72), rgba(2, 5, 4, 0.88));
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  text-align: center;
  pointer-events: auto;
  transform-origin: center center;
}
#slide-panel.crt-on { animation: crtOn 460ms cubic-bezier(0.16, 0.84, 0.24, 1) both; }
#slide-panel.crt-off { animation: crtOff 520ms cubic-bezier(0.2, 0.7, 0.15, 1) forwards; }
#slide-panel.crt-off.fast { animation-duration: 340ms; }
#slide-panel.suck { animation: suckContent 1.05s cubic-bezier(0.5, 0, 0.9, 0.4) forwards; }

.logo-badge {
  width: 46px;
  height: 46px;
  margin: 0 auto 10px;
}
.logo-badge svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 0 6px rgba(0, 255, 85, 0.5)) drop-shadow(0 0 22px rgba(0, 255, 85, 0.22));
}
#slide-title {
  margin: 18px 0 12px;
  font-size: clamp(34px, 6.5vw, 72px);
  font-weight: 700;
  line-height: 1.02;
  letter-spacing: 0.04em;
}
#slide-title span {
  display: inline-block;
  min-width: 0.58em;
  text-align: center;
  opacity: 0;
  color: #d4ffd4;
  text-shadow: 0 0 4px #fff, 0 0 8px #6f6, 0 0 18px #0f0, 0 0 36px #050;
  will-change: transform, opacity;
}
#slide-title span.br {
  display: block;
  width: 100%;
  height: 0.35em;
  min-width: 0;
  opacity: 1;
  color: transparent;
  text-shadow: none;
}
#slide-lead {
  max-width: 60ch;
  margin: 0 auto 22px;
  font-size: clamp(13px, 1.45vw, 17px);
  line-height: 1.7;
  color: rgba(220, 255, 232, 0.78);
  text-shadow: 0 0 12px rgba(125, 251, 164, 0.10);
}
#slide-lead span { opacity: 0; transition: opacity 0.1s; }

#slide-cta {
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.45s ease, transform 0.45s ease;
}
#slide-cta.show { opacity: 1; transform: translateY(0); }
#slide-status {
  margin-bottom: 18px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: rgba(125, 251, 164, 0.55);
  text-transform: uppercase;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}
#slide-status .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #0f0;
  box-shadow: 0 0 8px #0f0, 0 0 16px rgba(0, 255, 0, 0.6);
  animation: dotBlink 1.2s steps(1, end) infinite;
}
@keyframes dotBlink {
  0%, 55% { opacity: 1; }
  56%, 100% { opacity: 0.25; }
}
.link-row {
  display: flex;
  gap: 14px;
  justify-content: center;
  align-items: stretch;
  flex-wrap: wrap;
}
.mlink {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.55rem;
  min-height: 46px;
  padding: 0.85rem 1.3rem;
  border-radius: 999px;
  background: transparent;
  color: var(--green);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  text-decoration: none;
  transition:
    transform 0.18s ease,
    color 0.18s ease, filter 0.18s ease;
}
.mlink::before { content: "↗"; font-size: 1.05em; opacity: 0.9; }
.mlink:hover {
  transform: translateY(-2px);
  color: #eafff0;
  filter: brightness(1.2);
}
.mlink--alt { color: var(--green-soft); }
.mlink.static { animation: linkStatic 110ms steps(2, jump-none) 1; }
@keyframes linkStatic {
  0% { filter: none; }
  50% { filter: brightness(1.7) contrast(1.4); transform: translateY(-2px) translateX(0.6px); }
  100% { filter: none; }
}
#qr-box {
  width: 58px;
  height: 58px;
  padding: 5px;
  border-radius: 10px;
  background: rgba(0, 0, 0, 0.45);
}
#qr-box img {
  width: 100%;
  height: 100%;
  display: block;
  image-rendering: pixelated;
  border-radius: 5px;
}

/* ============ NAV (‹ ›) — без рамок, без блика ============ */
.tv-nav {
  position: fixed;
  top: 50%;
  z-index: 90;
  width: var(--nav-size);
  height: var(--nav-size);
  display: grid;
  place-items: center;
  border-radius: 18px;
  background: transparent;
  color: var(--green);
  font: 700 clamp(26px, 3vw, 36px) / 1 var(--mono);
  cursor: pointer;
  transform: translateY(-50%);
  transition:
    transform 0.18s ease,
    background 0.18s ease, filter 0.18s ease;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.tv-nav span {
  display: block;
  transform: translateY(-1px);
}
.tv-nav--prev { left: var(--nav-offset); border-radius: 18px 8px 8px 18px; }
.tv-nav--next { right: var(--nav-offset); border-radius: 8px 18px 18px 8px; }
.tv-nav:hover {
  transform: translateY(-50%) scale(1.06);
  filter: brightness(1.45);
}
.tv-nav:focus-visible { outline: 2px solid var(--green); outline-offset: 4px; }
.tv-nav.gone, #hud.gone, #bug.gone { display: none; }
.tv-nav.is-sucked { pointer-events: none; }
.tv-nav--prev.is-sucked { animation: suckPrev 680ms cubic-bezier(0.2, 0.7, 0.15, 1) forwards; }
.tv-nav--next.is-sucked { animation: suckNext 680ms cubic-bezier(0.2, 0.7, 0.15, 1) forwards; }
.tv-nav.pulse { animation: navPulse 240ms ease; }
@keyframes navPulse {
  0% { filter: brightness(1); }
  35% { transform: translateY(-50%) scale(1.07); filter: brightness(2.4); }
  100% { transform: translateY(-50%) scale(1); filter: brightness(1); }
}
@keyframes suckPrev {
  0% { transform: translateY(-50%) scale(1); opacity: 1; filter: brightness(1); }
  12% { transform: translateY(-50%) scale(1.1); filter: brightness(1.9) contrast(1.2); }
  45% {
    transform: translate(calc((50vw - var(--nav-offset) - var(--nav-size) / 2) * 0.45), -50%) scale(0.72, 0.08);
    opacity: 0.95;
    filter: brightness(2.8);
  }
  75% {
    transform: translate(calc((50vw - var(--nav-offset) - var(--nav-size) / 2) * 0.82), -50%) scale(0.22, 0.02);
    opacity: 0.75;
    filter: brightness(4.5);
  }
  100% {
    transform: translate(calc(50vw - var(--nav-offset) - var(--nav-size) / 2), -50%) scale(0.02);
    opacity: 0;
    filter: brightness(8) blur(2px);
  }
}
@keyframes suckNext {
  0% { transform: translateY(-50%) scale(1); opacity: 1; filter: brightness(1); }
  12% { transform: translateY(-50%) scale(1.1); filter: brightness(1.9) contrast(1.2); }
  45% {
    transform: translate(calc((-50vw + var(--nav-offset) + var(--nav-size) / 2) * 0.45), -50%) scale(0.72, 0.08);
    opacity: 0.95;
    filter: brightness(2.8);
  }
  75% {
    transform: translate(calc((-50vw + var(--nav-offset) + var(--nav-size) / 2) * 0.82), -50%) scale(0.22, 0.02);
    opacity: 0.75;
    filter: brightness(4.5);
  }
  100% {
    transform: translate(calc(-50vw + var(--nav-offset) + var(--nav-size) / 2), -50%) scale(0.02);
    opacity: 0;
    filter: brightness(8) blur(2px);
  }
}

/* ============ ГЛИТЧ-ПОЯВЛЕНИЕ КНОПОК ============ */
.glitch-in {
  --base-tf: translate(0, 0);
  animation: glitchIn 480ms linear both;
}
/* обратное появление (для VHS-перемотки): элемент «раз-возникает» и исчезает */
.glitch-out {
  --base-tf: translate(0, 0);
  animation: glitchIn 480ms linear both reverse;
  pointer-events: none;
}
.tv-nav.glitch-in { --base-tf: translateY(-50%); }
#hud.glitch-in { --base-tf: translateX(-50%); }
@keyframes glitchIn {
  0%   { opacity: 0; transform: var(--base-tf) skewX(18deg); filter: brightness(6) saturate(2); }
  10%  { opacity: 0.9; transform: var(--base-tf) translateX(-5px) skewX(-12deg); }
  20%  { opacity: 0.3; transform: var(--base-tf) translateX(6px); filter: brightness(2); }
  32%  { opacity: 1; transform: var(--base-tf) translateX(-4px) skewX(8deg); filter: brightness(3.5); }
  44%  { opacity: 0.45; transform: var(--base-tf) translateX(4px) skewX(-5deg); }
  58%  { opacity: 1; transform: var(--base-tf) translateX(-2px) skewX(3deg); filter: brightness(1.8); }
  72%  { opacity: 0.7; transform: var(--base-tf) translateX(2px) skewX(-2deg); }
  86%  { opacity: 1; transform: var(--base-tf) translateX(-1px) skewX(1deg); }
  100% { opacity: 1; transform: var(--base-tf); filter: brightness(1); }
}

/* ============ HUD (пауза / звук) — без рамок ============ */
#hud {
  position: fixed;
  left: 50%;
  bottom: clamp(12px, 2.5vh, 24px);
  transform: translateX(-50%);
  z-index: 90;
  display: flex;
  align-items: center;
  gap: 10px;
  user-select: none;
}
.hud-btn {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: transparent;
  color: rgba(125, 251, 164, 0.75);
  font: 700 13px / 1 var(--mono);
  cursor: pointer;
  transition: color 0.18s ease, opacity 0.3s, filter 0.18s ease;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.hud-btn:hover { color: #bfffd0; filter: brightness(1.25); }
.hud-btn:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
#nightBadge {
  display: none;
  padding: 5px 9px;
  border-radius: 999px;
  background: rgba(125, 251, 164, 0.07);
  color: rgba(125, 251, 164, 0.6);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.25em;
  user-select: none;
}
body.night #nightBadge { display: inline-block; }

/* HUD и баг засасываются в центр */
#hud.is-sucked, #bug.is-sucked { pointer-events: none; }
#hud.is-sucked { animation: hudSuck 700ms cubic-bezier(0.2, 0.7, 0.15, 1) forwards; }
#bug.is-sucked { animation: bugSuck 700ms cubic-bezier(0.2, 0.7, 0.15, 1) forwards; }
@keyframes hudSuck {
  0% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; filter: brightness(1); }
  40% { transform: translateX(-50%) translateY(calc(-50vh + 42px)) scale(0.55); opacity: 0.95; filter: brightness(2.6); }
  100% { transform: translateX(-50%) translateY(calc(-50vh + 26px)) scale(0.02); opacity: 0; filter: brightness(6) blur(2px); }
}
@keyframes bugSuck {
  0% { transform: translate(0, 0) scale(1); opacity: 1; filter: brightness(1); }
  40% { transform: translate(calc(-50vw + 150px), calc(50vh - 30px)) scale(0.55); opacity: 0.95; filter: brightness(2.6); }
  100% { transform: translate(calc(-50vw + 100px), calc(50vh - 18px)) scale(0.02); opacity: 0; filter: brightness(6) blur(2px); }
}

/* ============ TV BUG (кнопка ONEDOPEA MODE) ============ */
#bug {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 10px;
  border-radius: 999px;
  background: transparent;
  font: 700 10px / 1 var(--mono);
  letter-spacing: 0.3em;
  color: rgba(125, 251, 164, 0.5);
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.2s ease, filter 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}
#bug:hover { color: rgba(125, 251, 164, 0.95); filter: brightness(1.3); }
#bug:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
#bug .bug-dot {
  font-size: 8px;
  color: #0f0;
  animation: bugBlink 2.4s steps(1, end) infinite;
}
@keyframes bugBlink {
  0%, 78% { opacity: 1; }
  79%, 100% { opacity: 0.2; }
}
#bug.flick { animation: bugFlick 140ms steps(2, jump-none) 1; }
@keyframes bugFlick {
  0% { opacity: 1; transform: translateX(0) skewX(0); }
  50% { opacity: 0.25; transform: translateX(2px) skewX(8deg); }
  100% { opacity: 1; transform: translateX(0) skewX(0); }
}

/* ============ VHS REW (кнопка обратной перемотки) ============ */
#rew {
  position: fixed;
  bottom: 12px;
  right: 12px;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 10px;
  border-radius: 999px;
  background: transparent;
  font: 700 10px / 1 var(--mono);
  letter-spacing: 0.3em;
  color: rgba(125, 251, 164, 0.5);
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.2s ease, filter 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}
#rew:hover { color: rgba(125, 251, 164, 0.95); filter: brightness(1.3); }
#rew:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
#rew-osd {
  position: fixed;
  left: 20px;
  top: 18px;
  z-index: 130;
  font: 700 clamp(15px, 3.4vw, 24px) / 1 var(--mono);
  letter-spacing: 0.22em;
  color: rgba(210, 255, 225, 0.92);
  text-shadow: 0 0 10px rgba(0, 255, 85, 0.8), 0 0 2px rgba(255, 255, 255, 0.8);
  opacity: 0;
  pointer-events: none;
  white-space: nowrap;
}
body.rewing #rew-osd { animation: rewBlink 0.5s steps(1, end) infinite; }
@keyframes rewBlink {
  0%, 60% { opacity: 1; }
  61%, 100% { opacity: 0.12; }
}

#osd {
  position: fixed;
  left: 20px;
  bottom: 20px;
  z-index: 100;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.22em;
  color: rgba(210, 255, 225, 0.9);
  text-shadow: 0 0 10px rgba(0, 255, 85, 0.8), 0 0 2px rgba(255, 255, 255, 0.8);
  opacity: 0;
  pointer-events: none;
  text-transform: uppercase;
  white-space: nowrap;
}
#osd.show { animation: osdShow 1.5s steps(4, end) 1; }
@keyframes osdShow {
  0% { opacity: 0; }
  5% { opacity: 0.4; }
  9% { opacity: 1; }
  14% { opacity: 0.7; }
  18% { opacity: 1; }
  100% { opacity: 1; }
}

#toast {
  position: fixed;
  left: 50%;
  bottom: clamp(60px, 9vh, 88px);
  transform: translateX(-50%);
  z-index: 100;
  padding: 6px 14px;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.55);
  color: var(--green);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.2em;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
  white-space: nowrap;
}
#toast.show { opacity: 1; }

#mode-label {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 100;
  padding: 6px 14px;
  border-radius: 999px;
  background: rgba(20, 0, 16, 0.6);
  color: #ff9dfb;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-shadow: 0 0 8px #f0f;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  white-space: nowrap;
}
#mode-label.show { opacity: 1; }
#mode-label.gold {
  color: #ffe08a;
  background: rgba(24, 16, 0, 0.6);
  text-shadow: 0 0 8px #fc0;
}

/* ============ AFTERGLOW GHOST ============ */
.ghost-layer {
  position: fixed;
  inset: 0;
  z-index: 7;
  pointer-events: none;
  animation: ghostFade 480ms ease-out forwards;
}
.ghost-layer * {
  animation: none !important;
  transition: none !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
}
@keyframes ghostFade {
  0% { opacity: 0.5; filter: blur(0.5px) brightness(1.3); }
  100% { opacity: 0; filter: blur(4px) brightness(1.7); }
}

/* ============ TYPING ============ */
#typing-el {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: var(--mono);
  font-size: clamp(18px, 4vw, 28px);
  color: #0f0;
  text-shadow: 0 0 6px #0f0;
  z-index: 6;
  pointer-events: none;
  white-space: pre;
  display: none;
  gap: 0;
  flex-wrap: wrap;
  justify-content: center;
}
#typing-el span {
  display: inline-block;
  min-width: 0.6em;
  text-align: center;
  opacity: 0;
  transition: opacity 0.3s, color 0.2s;
}

/* ============ OVERLAYS ============ */
#zap {
  position: fixed;
  inset: 0;
  z-index: 9998;
  pointer-events: none;
  background: #eafff0;
  opacity: 0;
}
#zap.go { animation: zapFlash 240ms linear forwards; }
@keyframes zapFlash {
  0% { opacity: 0; }
  15% { opacity: 0.5; }
  30% { opacity: 0.18; }
  50% { opacity: 0.4; }
  70% { opacity: 0.1; }
  100% { opacity: 0; }
}
#tv-effect {
  position: fixed;
  inset: 0;
  background: #fff;
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  transform-origin: center center;
}
#tv-effect.active { animation: tvTurnOff 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards; }
@keyframes tvTurnOff {
  0% { opacity: 1; transform: scaleY(1) scaleX(1); filter: brightness(1); }
  20% { opacity: 1; transform: scaleY(0.005) scaleX(1); filter: brightness(5); }
  100% { opacity: 0; transform: scaleY(0.005) scaleX(0.005); filter: brightness(0); }
}

/* ============ SHARED KEYFRAMES ============ */
@keyframes pulse {
  0%, 100% { filter: brightness(1) drop-shadow(0 0 8px #0f0); }
  50% { filter: brightness(1.35) drop-shadow(0 0 22px #0f0); }
}
@keyframes glitch-anim {
  0% { transform: translate(0); }
  20% { transform: translate(-3px, 2px); }
  40% { transform: translate(3px, -2px); }
  60% { transform: translate(-2px, 3px); }
  80% { transform: translate(2px, -3px); }
  100% { transform: translate(0); }
}
@keyframes glitch-skew {
  0% { transform: skew(0deg); }
  20% { transform: skew(-3deg); }
  40% { transform: skew(3deg); }
  60% { transform: skew(-1deg); }
  80% { transform: skew(1deg); }
  100% { transform: skew(0deg); }
}
@keyframes crtOn {
  0% { transform: scaleY(0.004) scaleX(0.06); opacity: 0; filter: brightness(9) blur(2px); }
  35% { transform: scaleY(0.08) scaleX(1.04); opacity: 0.75; filter: brightness(3.2); }
  70% { transform: scaleY(0.65) scaleX(1.01); opacity: 0.95; filter: brightness(1.45); }
  100% { transform: scale(1); opacity: 1; filter: brightness(1); }
}
@keyframes crtOff {
  0% { transform: scale(1); opacity: 1; filter: brightness(1); }
  15% { transform: scale(1.015); filter: brightness(1.55) contrast(1.12); }
  55% { transform: scaleY(0.08) scaleX(1.03); opacity: 0.95; filter: brightness(3); }
  78% { transform: scaleY(0.012) scaleX(1.18); opacity: 0.72; filter: brightness(5.2); }
  100% { transform: scaleY(0.001) scaleX(0.02); opacity: 0; filter: brightness(9) blur(2px); }
}
@keyframes suckContent {
  0% { transform: scale(1); opacity: 1; filter: brightness(1); }
  30% { filter: brightness(1.6); }
  70% { transform: scale(0.35); opacity: 0.9; filter: brightness(2.6); }
  100% { transform: scale(0.02); opacity: 0; filter: brightness(6) blur(2px); }
}

/* ============ NIGHT MODE ============ */
body.night .vignette { background: radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, 0.8) 100%); }
body.night .crt-flicker { filter: brightness(1.9); }
body.night #oracle.onedopea-mode span.locked {
  text-shadow: 2px 0 #ff00ff, -2px 0 #00ffff, 0 0 14px #0f0, 0 0 30px #0f0, 0 0 60px #0f0, 0 0 90px #050;
}

/* ============ RESPONSIVE / MOTION ============ */
@media (max-width: 640px) {
  :root {
    --nav-size: 44px;
    --nav-offset: 10px;
  }
  #slide-panel {
    width: calc(100vw - 112px);
    padding: 22px 16px;
    border-radius: 18px;
  }
  #slide-lead { margin-bottom: 18px; }
  .mlink { min-height: 40px; padding: 0.7rem 1rem; font-size: 11px; }
  #qr-box { width: 50px; height: 50px; }
}
/* landscape: слайд в две колонки */
@media (orientation: landscape) and (max-height: 560px) {
  #slide-panel {
    width: min(980px, calc(100vw - 230px));
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    column-gap: 48px;
    row-gap: 4px;
    text-align: left;
    padding: 26px 44px;
  }
  .logo-badge, #slide-title, #slide-lead { grid-column: 1; }
  #slide-cta { grid-column: 2; grid-row: 1 / span 3; }
  #slide-title { margin: 10px 0 8px; font-size: clamp(30px, 7vh, 58px); }
  #slide-lead { margin: 0; max-width: 52ch; }
  #slide-status { margin-bottom: 14px; justify-content: flex-start; }
  .link-row { flex-direction: column; align-items: stretch; }
  .mlink { width: 180px; }
  #qr-box { margin: 0 auto; }
}
@media (prefers-reduced-motion: reduce) {
  .crt-flicker, body.glitch-mode { animation: none !important; }
  #slide-panel.crt-on,
  #slide-panel.crt-off,
  #slide-panel.suck,
  .tv-nav.is-sucked,
  #hud.is-sucked,
  #bug.is-sucked,
  .glitch-in,
  #tv-effect.active,
  #zap.go,
  .mlink.static,
  #osd.show,
  #bug.flick {
    animation-duration: 1ms !important;
  }
}
</style>

function randomGlyph() {

/* ============ SOUND (полностью отключён) ============ */
function sfxZap() {}
function sfxPowerOff() {}
function sfxPowerOn() {}
function sfxType() {}
function sfxDecode() {}

/* ============ TOAST ============ */
function showToast(text, ms = 900) {
  toastEl.textContent = text;
  toastEl.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms);
}

/* ============ RAIN LEVEL (↑ / ↓) ============ */
function applyRainLevel() {
  spawnChance = 0.15 + rainLevel * 0.15;
  maxDrops = Math.max(15, Math.floor(C.width / S) * (0.10 + rainLevel * 0.075));
}
function bumpRain(dir) {
  const next = Math.max(0, Math.min(5, rainLevel + dir));
  if (next === rainLevel) return;
  rainLevel = next;
  applyRainLevel();
  showToast('RAIN ' + (dir > 0 ? '▲' : '▼') + ' ' + rainLevel);
}

/* ============ TIME SCALE ([ ] / свайп ↑↓ на телефоне) ============ */
function setTimeScale(dir) {
  const next = Math.max(0.5, Math.min(2.0, Math.round((timeScale + dir * 0.25) * 100) / 100));
  if (next === timeScale) return;
  timeScale = next;
  showToast('TIME ×' + timeScale);
}

/* ============ NIGHT MODE (23:00 - 07:00) ============ */
function isNightNow() {
  const h = new Date().getHours();
  return h >= 23 || h < 7;
}
function applyNight() {
  const n = isNightNow();
  if (n === nightOn) return;
  nightOn = n;
  document.body.classList.toggle('night', n);
  showToast(n ? 'NIGHT MODE ON' : 'NIGHT MODE OFF');
}

/* ============ СЕКРЕТНЫЕ ФРАЗЫ ============ */
function showModeLabel(text, ms, variant) {
  modeLabel.textContent = text;
  modeLabel.classList.remove('gold');
  if (variant) modeLabel.classList.add(variant);
  modeLabel.classList.add('show');
  if (modeTimer) clearTimeout(modeTimer);
  modeTimer = setTimeout(() => modeLabel.classList.remove('show'), ms);
}
function activateGlitchMode() {
  document.body.classList.add('glitch-mode');
  showModeLabel('ONEDOPEA MODE // 10S', 10000);
  sfxGlitch();
  buzz(20);
  if (glitchTimer) clearTimeout(glitchTimer);
  glitchTimer = setTimeout(() => document.body.classList.remove('glitch-mode'), 10000);
}
function activateGoldenMode() {
  document.body.classList.add('golden');
  showModeLabel('GOLDEN MODE // 15S', 15000, 'gold');
  sfxGlitch();
  buzz(40);
  if (goldenTimer) clearTimeout(goldenTimer);
  goldenTimer = setTimeout(() => document.body.classList.remove('golden'), 15000);
}
const sessionStart = Date.now();
function showStats() {
  const s = ((Date.now() - sessionStart) / 1000) | 0;
  const t = pad2((s / 60) | 0) + ':' + pad2(s % 60);
  showToast('SW ' + switchCount + ' • PAGE ' + t + ' • RAIN ' + rainLevel + ' • ×' + timeScale, 3000);
}
const SECRET_CODES = {
  onedopea: activateGlitchMode,
  konami: activateGoldenMode,
  stats: showStats
};

/* ============ LIVE STATUS ============ */
function fmtUptime() {
  const s = ((Date.now() - sessionStart) / 1000) | 0;
  const h = (s / 3600) | 0, m = ((s % 3600) / 60) | 0, sec = s % 60;
  return pad2(h) + ':' + pad2(m) + ':' + pad2(sec);
}
uptimeEl.textContent = fmtUptime();
setInterval(() => { uptimeEl.textContent = fmtUptime(); }, 1000);
setInterval(() => { pingEl.textContent = (8 + ((Math.random() * 34) | 0)) + 'MS'; }, 2600);

/* QR: без сети — просто скрываем блок */
document.getElementById('qr-img').addEventListener('error', () => {

/* ============ TV BUG (клик = ONEDOPEA MODE) ============ */
function scheduleBugFlick() {
  setTimeout(() => {
    if (!document.hidden) {
      bugEl.classList.remove('flick');
      void bugEl.offsetWidth;
      bugEl.classList.add('flick');
    }
    scheduleBugFlick();

}
scheduleBugFlick();
bugEl.addEventListener('animationend', () => bugEl.classList.remove('flick'));

/* ============ HOVER-СТАТИКА НА ССЫЛКАХ ============ */
document.querySelectorAll('.mlink').forEach(a => {
  a.addEventListener('mouseenter', () => {
    a.classList.remove('static');

/* ============ OSD КАНАЛ ============ */
function showOsd(text) {
  osdEl.textContent = text;
  osdEl.classList.remove('show');
  void osdEl.offsetWidth;
  osdEl.classList.add('show');
  if (osdTimer) clearTimeout(osdTimer);
  osdTimer = setTimeout(() => osdEl.classList.remove('show'), 1500);
}

console.log('%cONEDOPEA %c// v3.3 %c— фразы: "onedopea" "konami" "stats" | свайп ←→ — слайды, свайп↑↓ / [ ] — время, ↑↓ — дождь, F — fullscreen', 'color:#0f0;font-weight:bold;font-size:14px', 'color:#7dfba4', 'color:#0a0');

/* ============ KEYBOARD ============ */
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') { e.preventDefault(); doNext(); return; }
  if (e.key === 'ArrowLeft') { e.preventDefault(); doPrev(); return; }
  if (e.key === 'ArrowUp') { e.preventDefault(); bumpRain(1); return; }
  if (e.key === 'ArrowDown') { e.preventDefault(); bumpRain(-1); return; }
  if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFullscreen(); return; }
  if (e.key === '[') { e.preventDefault(); setTimeScale(-1); return; }
  if (e.key === ']') { e.preventDefault(); setTimeScale(1); return; }
  if (!e.repeat && e.key.length === 1 && /[a-z]/i.test(e.key)) {
    codeBuf = (codeBuf + e.key.toLowerCase()).slice(-8);
    for (const code in SECRET_CODES) {
      if (codeBuf.endsWith(code)) {
        codeBuf = '';
        SECRET_CODES[code]();
        break;
      }
    }
  }
});

/* ============ MOUSE PARALLAX ============ */
document.addEventListener('mousemove', (e) => {
  mouseNX = (e.clientX / window.innerWidth - 0.5) * 2;
  mouseNY = (e.clientY / window.innerHeight - 0.5) * 2;
});

/* ============ CHANNEL NOISE (8-20s, 120ms) ============ */
const noiseCv = document.createElement('canvas');
noiseCv.width = 180;
noiseCv.height = 100;
noiseCv.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;z-index:125;pointer-events:none;opacity:0;image-rendering:pixelated;transition:opacity 40ms linear;';
document.body.appendChild(noiseCv);
const nX = noiseCv.getContext('2d');
function noiseBurst() {
  const img = nX.createImageData(noiseCv.width, noiseCv.height);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = (Math.random() * 255) | 0;
    d[i] = (v * 0.35) | 0;
    d[i + 1] = v;
    d[i + 2] = (v * 0.5) | 0;
    d[i + 3] = 255;
  }
  nX.putImageData(img, 0, 0);
  noiseCv.style.opacity = '0.55';
  sfxNoise();
  buzz(8);
  setTimeout(() => { noiseCv.style.opacity = '0'; }, 120);
}
function scheduleNoise() {
  setTimeout(() => {
    if (!document.hidden && !frozen &&
        phase !== 'tv_collapse' && phase !== 'tv_flash' && phase !== 'rewind' &&
        Math.random() < 0.85) {
      noiseBurst();
    }
    scheduleNoise();
  }, 8000 + Math.random() * 12000);
}
scheduleNoise();

/* ============ FULLSCREEN (клавиша F) ============ */
function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    } else if (document.exitFullscreen) {
      document.exitFullscreen();
    }
  } catch (e) {}
}

/* ============ VHS REW (обратная перемотка к началу) ============ */
const REW_TIME = 3000;
const CONTENT_REV_MS = 1100;
let rewStart = 0;
let rewKind = 'none';
let rewContentT = 0;
let rewStage2 = false;

/* обратное воспроизведение появления слайда:
   надпись, подзаголовок и кнопки «раз-появляются» в обратном порядке */
function rewindSlideFrame(tRev) {
  h1Spans.forEach((el, i) => {
    if (el.dataset.role === 'br') return;
    const delay = i * H1_STEP;
    if (tRev > delay + H1_SCRAMBLE_TIME) {
      el.style.opacity = '1';
      el.textContent = el.dataset.target;
    } else if (tRev > delay) {
      el.style.opacity = '1';
      el.textContent = randomGlyph();
    } else {
      el.style.opacity = '0';
      el.textContent = '';
    }
  });
  const showCount = Math.max(0, Math.floor((tRev - LEAD_DELAY_MS) / LEAD_CHAR_MS));
  leadSpans.forEach((el, i) => {
    if (i < showCount) {
      el.style.opacity = '1';
      el.textContent = el.dataset.target;
    } else {
      el.style.opacity = '0';
    }
  });
  ctaEl.classList.toggle('show', tRev > CTA_SHOW_MS);
}
function rewindTitleFrame(tRev) {
  letters.forEach((el, i) => {
    if (el.dataset.hidden === '1') return;
    const delay = i * LETTER_STEP;
    if (tRev > delay + APPEAR_SCRAMBLE_TIME) {
      el.classList.add('show', 'locked');
      el.textContent = el.dataset.target;
    } else if (tRev > delay) {
      el.classList.add('show');
      el.classList.remove('locked');
      el.textContent = randomGlyph();
    } else {
      el.classList.remove('show', 'locked');
      el.textContent = '';
    }
  });
}
function rewindTypingFrame(tRev) {
  const showCount = Math.max(0, Math.floor(tRev / 70));
  typingSpans.forEach((el, i) => {
    if (i < showCount) {
      el.style.opacity = '1';
      el.textContent = el.dataset.target;
    } else {
      el.style.opacity = '0';
    }
  });
}

function startRewind(now) {
  if (phase === 'rewind') return;
  const prevPhase = phase;
  phase = 'rewind';
  rewStart = now;
  frozen = false;
  manualTarget = null;
  fastExit = false;
  document.body.classList.add('rewing');

  /* что именно отматываем и с какой точки таймлайна */
  rewKind = 'none';
  rewContentT = 0;
  if (idx >= 0 && idx < ITEMS.length && ITEMS[idx].type === 'slide' &&
      !slideWrap.classList.contains('hidden')) {
    rewKind = 'slide';
    rewContentT = prevPhase === 'enter' ? Math.min(now - phaseStart, SLIDE_ENTER_MS) : SLIDE_ENTER_MS;
  } else if (!oracleWrap.classList.contains('hidden')) {
    rewKind = 'title';
    const total = letters.length * LETTER_STEP + APPEAR_SCRAMBLE_TIME;
    rewContentT = prevPhase === 'enter' ? Math.min(now - phaseStart, total) : total;
  } else if (typingState !== 'idle' && typingSpans.length) {
    rewKind = 'typing';
    rewContentT = typingSpans.length * 70 + 400;
  }
  rewStage2 = false;

  /* UI-кнопки тоже отматываются — раз-появляются глитчем */
  [bugEl, rewBtn].forEach(b => {
    b.classList.remove('glitch-in');
    b.classList.add('glitch-out');
  });

  showOsd('◄◄ REW');
}
function finishRewind(now) {
  document.body.classList.remove('rewing');
  drops = [];
  crumbs = [];
  idx = -2;
  pendingIdx = 0;
  manualTarget = null;
  fastExit = false;
  cycleFallMultiplier = 1.0;
  rainActive = true;
  slideWrap.classList.add('hidden');
  slidePanel.classList.remove('crt-on', 'crt-off', 'suck', 'fast');
  oracleWrap.classList.add('hidden');
  typingEl.style.display = 'none';
  typingState = 'idle';
  phase = 'wait';
  phaseStart = now + 600;
  /* кнопки возвращаются глитчем, как при первом включении */
  [bugEl, rewBtn].forEach(b => {
    b.classList.remove('glitch-out');
    void b.offsetWidth;
    b.classList.add('glitch-in');
  });
  setTimeout(() => {
    [bugEl, rewBtn].forEach(b => b.classList.remove('glitch-in'));
  }, 520);
  showOsd('▶ PLAY');
}
rewBtn.addEventListener('click', () => startRewind(vNow));

/* ============ AFTERGLOW GHOST ============ */
function makeGhost(sourceWrap) {
  if (ghostEl) { ghostEl.remove(); ghostEl = null; }
  const g = sourceWrap.cloneNode(true);
  g.removeAttribute('id');
  g.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
  g.querySelectorAll('img').forEach(im => im.remove());
  g.classList.remove('hidden', 'suck');
  g.classList.add('ghost-layer');
  const first = g.firstElementChild;
  if (first) first.classList.remove('crt-on', 'crt-off', 'suck', 'fast', 'done');
  document.body.appendChild(g);
  ghostEl = g;
  setTimeout(() => { g.remove(); if (ghostEl === g) ghostEl = null; }, 520);
}

/* ============ SAFE ZONE ============ */
function getSafeZone() {
  if (idx >= 0 && idx < ITEMS.length && ITEMS[idx].type === 'slide' &&
      (phase === 'enter' || phase === 'hold' || phase === 'exit')) {
    const r = slidePanel.getBoundingClientRect();
    if (r.width > 0 && r.height > 0) {
      const p = 24;
      return { x: r.left - p, y: r.top - p, w: r.width + p * 2, h: r.height + p * 2 };
    }
  }
  const rect = oracleEl.getBoundingClientRect();
  if (rect.width > 0 && rect.height > 0) {
    const padding = 30;
    return {
      x: rect.left - padding,
      y: rect.top - padding,
      w: rect.width + padding * 2,
      h: rect.height + padding * 2
    };
  }
  const w = Math.min(C.width * 0.85, 800);
  const h = C.height * 0.30;
  return { x: (C.width - w) / 2, y: (C.height - h) / 2, w, h };
}

/* ============ TITLE SETUP ============ */
function setupTitle(i) {
  const item = i === -1 ? SPECIAL : ITEMS[i];
  slideWrap.classList.add('hidden');
  slidePanel.classList.remove('crt-on', 'crt-off', 'suck', 'fast');
  oracleWrap.classList.remove('hidden', 'suck');
  oracleEl.href = item.url;
  oracleEl.title = item.word.replace('\n', ' ') + ' → ' + item.url;
  oracleEl.setAttribute('aria-label', item.word.replace('\n', ' ') + ' Telegram link');
  oracleEl.classList.remove('done', 'inactive');
  if (i === -1) {
    oracleEl.classList.add('inactive', 'onedopea-mode');
  } else {
    oracleEl.classList.add('inactive');
  }
  oracleEl.innerHTML = '';

  letters = item.word.split('').map(ch => {
    const span = document.createElement('span');
    if (ch === '\n') {
      span.style.display = 'block';
      span.style.width = '100%';
      span.style.height = '0.5em';
      span.dataset.locked = '1';
      span.dataset.hidden = '1';
      span.classList.add('show');
    } else {
      span.dataset.target = ch;
      span.dataset.locked = '0';
      span.dataset.hidden = '0';
      span.textContent = '';
    }
    oracleEl.appendChild(span);
    return span;
  });
  typingEl.style.display = 'none';
}

function hideTitle() {
  makeGhost(oracleWrap);
  oracleEl.innerHTML = '';
  oracleEl.classList.remove('done', 'onedopea-mode');
  oracleWrap.classList.add('hidden');
}

/* ============ SLIDE SETUP ============ */
function setupSlide() {
  oracleEl.innerHTML = '';
  oracleEl.classList.remove('done', 'onedopea-mode');
  oracleWrap.classList.add('hidden');
  slideWrap.classList.remove('hidden');
  slidePanel.classList.remove('crt-on', 'crt-off', 'suck', 'fast');

  slideTitle.innerHTML = '';
  h1Spans = ITEMS[0].word.split('').map(ch => {
    const span = document.createElement('span');
    if (ch === '\n') {
      span.dataset.role = 'br';
      span.classList.add('br');
      span.dataset.locked = '1';
    } else {
      span.dataset.target = ch;
      span.dataset.locked = '0';
    }
    slideTitle.appendChild(span);
    return span;
  });

  slideLead.innerHTML = '';
  leadSpans = SLIDE_LEAD.split('').map(ch => {
    const span = document.createElement('span');
    span.dataset.target = ch;
    slideLead.appendChild(span);
    return span;
  });
  currentLeadIdx = 0;
  leadStartAt = vNow;
  ctaGlitched = false;
  ctaEl.classList.remove('show');

  void slidePanel.offsetWidth;
  slidePanel.classList.add('crt-on');
}

function hideSlide() {
  makeGhost(slideWrap);
  slidePanel.classList.remove('crt-on', 'crt-off', 'suck', 'fast');
  slideWrap.classList.add('hidden');
}

/* ============ CYCLE MACHINE ============ */
function startEnter(i, now) {
  idx = i;
  phase = 'enter';
  phaseStart = now;
  stuckWarned = false;
  frozen = false;
  /* на финальном слайде ONEDOPEA — только надпись-ссылка, без матрицы позади */
  rainActive = i !== -1;
  if (i === -1 || ITEMS[i].type === 'title') setupTitle(i);
  else setupSlide();
  switchCount++;
  if (i === -1) {
    sfxGlitch();
    showOsd('CH -- // ONEDOPEA');
  } else {
    const item = ITEMS[i];
    if (i === 0) sfxPowerOn();
    else sfxDecode();
    showOsd('CH 0' + (i + 1) + ' // ' + item.word.replace('\n', ' ').toUpperCase());
  }
}

function goToZap(t, now) {
  pendingIdx = t;
  phase = 'zap';
  phaseStart = now;
  sfxZap();
  buzz(12);
  zapEl.classList.remove('go');
  void zapEl.offsetWidth;
  zapEl.classList.add('go');
}

function finishExit(now) {
  if (manualTarget !== null) {
    const t = manualTarget;
    manualTarget = null;
    fastExit = false;
    goToZap(t, now);
    return;
  }
  fastExit = false;
  if (idx === -1) {
    pendingIdx = 0;
    phase = 'between';
    phaseStart = now + BETWEEN_WORDS_TIME;
    rainActive = true;
    cycleFallMultiplier = Math.min(16.0, cycleFallMultiplier * 2);
    return;
  }
  if (idx === ITEMS.length - 1) {
    triggerTvOff(now);
    return;
  }
  goToZap((idx + 1) % ITEMS.length, now);
}

function triggerTvOff(now) {
  phase = 'tv_collapse';
  collapseStart = now;
  rainActive = false;
  manualTarget = null;
  fastExit = false;
  sfxPowerOff();
  buzz(30);

  drops.forEach(d => { d.collapsing = true; d.vx = 0; d.vy = 0; });
  crumbs.forEach(c => { c.collapsing = true; });

  if (idx >= 0 && idx < ITEMS.length && ITEMS[idx].type === 'slide') {
    slidePanel.classList.add('suck');
  } else if (idx !== -2) {
    oracleWrap.classList.add('suck');
  }
}

/* ============ SLIDE UPDATE ============ */
function typeLead(t) {
  const showCount = Math.max(0, Math.floor((vNow - leadStartAt - LEAD_DELAY_MS) / LEAD_CHAR_MS));
  if (showCount > currentLeadIdx && currentLeadIdx < leadSpans.length) {
    for (let i = currentLeadIdx; i < showCount; i++) {
      leadSpans[i].textContent = leadSpans[i].dataset.target;
      leadSpans[i].style.opacity = '1';
    }
    currentLeadIdx = showCount;
    sfxType();
  }
  if (t > CTA_SHOW_MS) {
    ctaEl.classList.add('show');
    if (!ctaGlitched) {
      ctaGlitched = true;
      document.querySelectorAll('.mlink').forEach(m => m.classList.add('glitch-in'));
      qrBoxEl.classList.add('glitch-in');
      setTimeout(() => {
        document.querySelectorAll('.mlink').forEach(m => m.classList.remove('glitch-in'));
        qrBoxEl.classList.remove('glitch-in');
      }, 520);
    }
  }
}

function updateSlide(now) {
  if (phase === 'enter') {
    const t = now - phaseStart;
    h1Spans.forEach((el, i) => {
      if (el.dataset.role === 'br' || el.dataset.locked === '1') return;
      const delay = i * H1_STEP;
      if (t < delay) return;
      el.style.opacity = '1';
      el.textContent = randomGlyph();
      if (t > delay + H1_SCRAMBLE_TIME) {
        el.dataset.locked = '1';
        el.textContent = el.dataset.target;
      }
    });
    typeLead(t);
    /* ФРИЗ: как только надпись BotControl собралась — матрица замирает
       статичным кадром, но сценарий проигрывается дальше */
    const titleDone = h1Spans.every(el => el.dataset.role === 'br' || el.dataset.locked === '1');
    if (!frozen && titleDone) {
      frozen = true;
      rainActive = false;
    }
    if (t > SLIDE_ENTER_MS) {
      phase = 'hold';
      phaseStart = now;
    }
    return;
  }

  if (phase === 'hold') {
    typeLead(now - phaseStart + SLIDE_ENTER_MS);
    h1Spans.forEach(el => {
      if (el.dataset.role === 'br') return;
      if (el.dataset.locked === '1' && el.dataset.target && Math.random() < 0.015) {
        const target = el.dataset.target;
        el.textContent = randomGlyph();
        setTimeout(() => {
          if (phase === 'hold' && el.dataset.target === target) el.textContent = target;
        }, 40 + Math.random() * 60);
      }
    });
    if (Math.random() < 0.04) {
      const vis = [];
      leadSpans.forEach(s => { if (s.style.opacity === '1') vis.push(s); });
      if (vis.length) {
        const s = vis[(Math.random() * vis.length) | 0];
        const tg = s.dataset.target;
        s.textContent = randomGlyph();
        s.style.color = '#0a0';
        setTimeout(() => { s.textContent = tg; s.style.color = ''; }, 50);
      }
    }
    if (now - phaseStart > SLIDE_HOLD_MS) {
      phase = 'exit';
      phaseStart = now;
      slidePanel.classList.remove('crt-on');
      void slidePanel.offsetWidth;
      slidePanel.classList.add('crt-off');
    }
    return;
  }

  if (phase === 'exit') {
    const t = now - phaseStart;
    const step = fastExit ? 8 : 24;
    const hideMs = fastExit ? 140 : 260;
    const total = fastExit ? 380 : SLIDE_EXIT_MS;
    h1Spans.forEach((el, i) => {
      if (el.dataset.role === 'br' || el.dataset.gone === '1') return;
      const d = i * step;
      if (t < d) return;
      el.textContent = randomGlyph();
      if (t > d + hideMs) {
        el.style.opacity = '0';
        el.dataset.gone = '1';
      }
    });
    leadSpans.forEach((el, i) => {
      if (el.dataset.gone === '1') return;
      const d = (leadSpans.length - 1 - i) * (fastExit ? 3 : 6);
      if (t < d) return;
      el.style.opacity = '0';
      el.dataset.gone = '1';
    });
    if (t > total) {
      hideSlide();
      finishExit(now);
    }
  }
}

/* ============ TITLE UPDATE ============ */
function updateTitle(now) {
  if (phase === 'enter') {
    const t = now - phaseStart;
    letters.forEach((el, i) => {
      if (el.dataset.locked === '1') return;
      const delay = i * LETTER_STEP;
      if (t < delay) return;
      el.classList.add('show');
      el.textContent = randomGlyph();
      if (t > delay + APPEAR_SCRAMBLE_TIME) {
        el.dataset.locked = '1';
        el.textContent = el.dataset.target;
        el.classList.add('locked');
      }
    });
    if (letters.every(el => el.dataset.locked === '1')) {
      phase = 'hold';
      phaseStart = now;
      oracleEl.classList.remove('inactive');
      oracleEl.classList.add('done');
    }
    return;
  }

  if (phase === 'hold') {
    const holdDuration = idx === -1 ? SPECIAL_HOLD_TIME : HOLD_TIME;
    if (idx !== -1) {
      letters.forEach(el => {
        if (el.dataset.locked === '1' && el.dataset.hidden === '0' && Math.random() < 0.02) {
          const target = el.dataset.target;
          el.textContent = randomGlyph();
          setTimeout(() => {
            if (phase === 'hold' && el.dataset.target === target) el.textContent = target;
          }, 40 + Math.random() * 60);
        }
      });
    } else {
      letters.forEach(el => {
        if (el.dataset.role === 'br') return;
        if (Math.random() < 0.06) {
          const target = el.dataset.target;
          el.textContent = randomGlyph();
          el.style.color = Math.random() > 0.5 ? '#ff00ff' : '#00ffff';
          setTimeout(() => {
            if (phase === 'hold') { el.textContent = target; el.style.color = ''; }
          }, 60);
        }
      });
    }
    if (now - phaseStart > holdDuration) {
      phase = 'exit';
      phaseStart = now;
      oracleEl.classList.remove('done', 'onedopea-mode');
      oracleEl.classList.add('inactive');
      letters.forEach(el => { if (el.dataset.locked !== '1') el.dataset.hidden = '0'; });
    }
    return;
  }

  if (phase === 'exit') {
    const t = now - phaseStart;
    const step = fastExit ? 40 : LETTER_STEP;
    const scrambleTime = fastExit ? 200 : (idx === -1 ? DISAPPEAR_SCRAMBLE_TIME * 0.8 : DISAPPEAR_SCRAMBLE_TIME);
    letters.forEach((el, i) => {
      if (el.dataset.hidden === '1') return;
      const delay = i * step;
      if (t < delay) return;
      el.classList.remove('locked');
      el.textContent = randomGlyph();
      if (t > delay + scrambleTime) {
        el.classList.remove('show');
        el.dataset.hidden = '1';
      }
    });
    if (letters.every(el => el.dataset.hidden === '1')) {
      if (idx === ITEMS.length - 1 && manualTarget === null) {
        finishExit(now);
        return;
      }
      hideTitle();
      finishExit(now);
    }
  }
}

/* ============ TYPING ============ */
function setupTyping(now) {
  typingEl.innerHTML = '';
  typingSpans = TYPING_STRING.split('').map(ch => {
    const span = document.createElement('span');
    span.dataset.target = ch;
    span.dataset.hidden = '0';
    span.textContent = '';
    span.style.opacity = '0';
    typingEl.appendChild(span);
    return span;
  });
  typingState = 'typing';
  currentTypingIndex = 0;
  typingStartTime = now;
  typingEl.style.display = 'flex';
}

function updateTyping(now) {
  if (typingState === 'typing') {
    const elapsed = now - typingStartTime;
    const charsToShow = Math.floor(elapsed / 70);
    if (charsToShow > currentTypingIndex && currentTypingIndex < typingSpans.length) {
      currentTypingIndex = charsToShow;
      for (let i = 0; i < currentTypingIndex; i++) {
        typingSpans[i].textContent = typingSpans[i].dataset.target;
        typingSpans[i].style.opacity = '1';
      }
      sfxType();
    }
    if (currentTypingIndex >= typingSpans.length) {
      typingState = 'holding';
      typingStartTime = now;
    }
  } else if (typingState === 'holding') {
    if (now - typingStartTime > 1800) {
      typingState = 'crumbling';
      typingStartTime = now;
    }
  } else if (typingState === 'crumbling') {
    const elapsed = now - typingStartTime;
    typingSpans.forEach((span, i) => {
      const delay = i * 25;
      if (elapsed > delay && span.dataset.hidden === '0') {
        span.dataset.hidden = '1';
        span.textContent = randomGlyph();
        span.style.color = '#0a0';
        span.style.opacity = '0';
      }
    });
    const allHidden = typingSpans.every(s => s.dataset.hidden === '1');
    if (allHidden && elapsed > typingSpans.length * 25 + 600) {
      typingState = 'idle';
      pendingIdx = -1;
      phase = 'between';
      phaseStart = now + 400;
    }
  }
}

/* ============ NAV ============ */
function canNavigate() {
  return phase === 'hold' && idx >= 0 && idx < ITEMS.length;
}
function unfreeze() {
  if (!frozen) return;
  frozen = false;
  rainActive = true;
}
function startManualExit(target) {
  manualTarget = target;
  fastExit = true;
  phase = 'exit';
  phaseStart = vNow;
  if (ITEMS[idx].type === 'slide') {
    slidePanel.classList.remove('crt-on');
    void slidePanel.offsetWidth;
    slidePanel.classList.add('crt-off', 'fast');
  }
}
function doNext() {
  if (!canNavigate()) return;
  unfreeze();
  if (idx === ITEMS.length - 1) {
    triggerTvOff(vNow);
    return;
  }
  startManualExit(idx + 1);
}
function doPrev() {
  if (!canNavigate()) return;
  unfreeze();
  startManualExit((idx + ITEMS.length - 1) % ITEMS.length);
}

/* Свайп: ←→ навигация, ↑↓ — скорость времени (телефон) */
let touchStartX = 0, touchStartY = 0;
document.addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
}, { passive: true });
document.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].screenX - touchStartX;
  const dy = e.changedTouches[0].screenY - touchStartY;
  if (Math.abs(dy) > 45 && Math.abs(dy) > Math.abs(dx)) {
    setTimeScale(dy < 0 ? 1 : -1);
    return;
  }
  if (Math.abs(dx) < 45) return;
  if (dx < 0) doNext();
  else doPrev();
}, { passive: true });

/* ============ MATRIX RAIN ============ */
function resize() {
  C.width = window.innerWidth;
  C.height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  applyRainLevel();
}
resize();
addEventListener('resize', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

function glyphAt(d, i) {
  return GLYPHS[((d.glyph - i) % GLYPHS.length + GLYPHS.length) % GLYPHS.length];
}
function spawnDrop() {
  drops.push({
    x: Math.floor(Math.random() * (C.width / S)) * S,
    y: -S, startY: -S,
    speed: 1.2 + Math.random() * 2.2,
    glyph: (Math.random() * GLYPHS.length) | 0,
    shattered: false, collapsing: false,
    vx: 0, vy: 0, alpha: 1
  });
}
function shatterDrop(d) {
  d.shattered = true;
  for (let i = 0; i < N; i++) {
    const py = d.y - i * S;
    if (py < -S || py > C.height + S) continue;
    const count = 4 + ((Math.random() * 4) | 0);
    for (let j = 0; j < count; j++) {
      crumbs.push({
        x: d.x + Math.random() * S, y: py + Math.random() * S,
        vx: (Math.random() - 0.5) * 7, vy: (Math.random() - 0.5) * 6 - 1,
        life: 1, decay: 0.012 + Math.random() * 0.02,
        w: 1 + Math.random() * 4, h: 1 + Math.random() * 4,
        isChar: Math.random() < 0.35, ch: glyphAt(d, i),
        chSize: S * (0.28 + Math.random() * 0.5),
        rot: (Math.random() - 0.5) * 4, rotV: (Math.random() - 0.5) * 0.28,
        collapsing: false
      });
    }
  }
}
function updateDrop(d) {
  if (d.collapsing) {
    const cx = C.width / 2, cy = C.height / 2;
    const dx = cx - d.x, dy = cy - d.y;
    const dist = Math.hypot(dx, dy) || 1;
    const elapsed = vNow - collapseStart;
    const accel = 0.8 + elapsed / 800;
    d.vx = (d.vx || 0) + (dx / dist) * accel;
    d.vy = (d.vy || 0) + (dy / dist) * accel;
    d.vx *= 0.94; d.vy *= 0.94;
    d.x += d.vx * timeScale; d.y += d.vy * timeScale;
    d.alpha = Math.min(1, dist / 100);
    return dist > 15;
  }
  if (!d.shattered) {
    const sz = getSafeZone();
    if (d.y >= sz.y && d.y <= sz.y + sz.h && d.x >= sz.x && d.x <= sz.x + sz.w) shatterDrop(d);
  }
  if (d.shattered) { d.alpha -= 0.07; return d.alpha > 0; }
  d.y += d.speed * timeScale;
  d.glyph = (d.glyph + 1) % GLYPHS.length;
  if (d.y - d.startY >= N * S * cycleFallMultiplier) shatterDrop(d);
  return d.y - N * S < C.height + S;
}
function updateCrumb(c) {
  if (c.collapsing) {
    const cx = C.width / 2, cy = C.height / 2;
    const dx = cx - c.x, dy = cy - c.y;
    const dist = Math.hypot(dx, dy) || 1;
    const elapsed = vNow - collapseStart;
    const accel = 1.5 + elapsed / 400;
    c.vx += (dx / dist) * accel; c.vy += (dy / dist) * accel;
    c.vx *= 0.92; c.vy *= 0.92;
    c.x += c.vx * timeScale; c.y += c.vy * timeScale;
    c.life = Math.min(1, dist / 60);
    return dist > 10;
  }
  c.x += c.vx * timeScale; c.y += c.vy * timeScale;
  c.vy += 0.16 * timeScale; c.vx *= 0.985;
  c.rot += c.rotV; c.life -= c.decay;
  return c.life > 0;
}
function drawDrop(d) {
  X.font = S + 'px monospace';
  const depth = 0.45 + ((d.speed - 1.2) / 2.2) * 0.8;
  const ox = parX * depth, oy = parY * depth;
  for (let i = 0; i < N; i++) {
    const py = d.y - i * S;
    if (py < -S || py > C.height) continue;
    const ch = glyphAt(d, i);
    if (i === 0 && !d.shattered) {
      X.shadowColor = '#0F0'; X.shadowBlur = 8;
      X.fillStyle = `rgba(200,255,200,${d.alpha})`;
    } else {
      X.shadowBlur = 0;
      const f = Math.max(0, 1 - i / N);
      const g = (255 * f * d.alpha) | 0;
      X.fillStyle = `rgba(0,${g},0,${d.alpha})`;
    }
    X.fillText(ch, d.x + ox, py + oy);
  }
  X.shadowBlur = 0;
}
function drawCrumb(c) {
  const a = Math.max(0, c.life);
  const g = (220 * a) | 0;
  X.save();
  X.translate(c.x, c.y);
  X.rotate(c.rot);
  if (c.isChar) {
    X.font = c.chSize + 'px monospace';
    X.fillStyle = `rgba(0,${g},40,${a})`;
    X.fillText(c.ch, 0, 0);
  } else {
    X.fillStyle = `rgba(0,${g},30,${a})`;
    X.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
  }
  X.restore();
}

/* ============ MAIN LOOP ============ */
function loop(rawNow) {
  const dt = Math.min(250, Math.max(0, rawNow - lastRaw));
  lastRaw = rawNow;
  vNow += dt * timeScale;
  const now = vNow;

  try {
  parX += (mouseNX * 7 - parX) * 0.04;
  parY += (mouseNY * 5 - parY) * 0.04;

  /* во время фриза кадр матрицы не перерисовывается — картинка застыла;
     во время rewinds кадр рисует собственный case 'rewind' */
  if (!frozen && phase !== 'rewind') {
  X.fillStyle = '#000';
  X.fillRect(0, 0, C.width, C.height);

  const spChance = spawnChance * (nightOn ? 1.4 : 1);
  if (rainActive && Math.random() < spChance && drops.length < maxDrops) spawnDrop();

  for (let i = drops.length - 1; i >= 0; i--) {
    if (updateDrop(drops[i])) drawDrop(drops[i]);
    else drops.splice(i, 1);
  }
  if (crumbs.length > MAX_CRUMBS) crumbs.splice(0, crumbs.length - MAX_CRUMBS);
  for (let i = crumbs.length - 1; i >= 0; i--) {
    if (updateCrumb(crumbs[i])) drawCrumb(crumbs[i]);
    else crumbs.splice(i, 1);
  }
  }

  switch (phase) {
    case 'wait':
      if (now >= phaseStart) startEnter(0, now);
      break;
    case 'tv_collapse': {
      const allGone = drops.length === 0 && crumbs.length === 0;
      if (allGone || now - collapseStart > 1500) {
        phase = 'tv_flash';
        const gen = ++tvFlashGen;
        tvOverlay.classList.add('active');
        setTimeout(() => {
          tvOverlay.classList.remove('active');
          if (gen === tvFlashGen) {
            phase = 'typing';
            setupTyping(vNow);
          }
        }, 600);
      }
      break;
    }
    case 'typing':
      updateTyping(now);
      break;
    case 'between':
      if (now >= phaseStart) startEnter(pendingIdx, now);
      break;
    case 'zap':
      if (now - phaseStart > ZAP_MS) startEnter(pendingIdx, now);
      break;
    case 'rewind': {
      /* VHS: контент отматывается назад, дождь летит вверх, tracking-полосы */
      const t = now - rewStart;
      X.fillStyle = '#000';
      X.fillRect(0, 0, C.width, C.height);

      /*_stage 1: обратное воспроизведение появления контента */
      if (rewKind !== 'none' && t < CONTENT_REV_MS) {
        const tRev = rewContentT * (1 - t / CONTENT_REV_MS);
        if (rewKind === 'slide') rewindSlideFrame(tRev);
        else if (rewKind === 'title') rewindTitleFrame(tRev);
        else rewindTypingFrame(tRev);
      } else if (rewKind !== 'none' && !rewStage2) {
        /* stage 2: панель «раз-включается» как обратный crt-on */
        rewStage2 = true;
        if (rewKind === 'slide') {
          slidePanel.classList.remove('crt-on');
          void slidePanel.offsetWidth;
          slidePanel.classList.add('crt-off', 'fast');
          setTimeout(() => {
            slideWrap.classList.add('hidden');
            slidePanel.classList.remove('crt-off', 'fast');
          }, 380);
        } else if (rewKind === 'title') {
          oracleWrap.classList.add('hidden');
        } else {
          typingEl.style.display = 'none';
          typingState = 'idle';
        }
      }

      if (drops.length < 12) {
        for (let k = 0; k < 12; k++) {
          spawnDrop();
          drops[drops.length - 1].y = Math.random() * C.height;
        }
      }
      const mult = 9 + (t / REW_TIME) * 11;
      for (const d of drops) {
        d.y -= d.speed * mult;
        d.glyph = (d.glyph - 2 + GLYPHS.length) % GLYPHS.length;
        if (d.y < -N * S) d.y = C.height + N * S;
        drawDrop(d);
      }
      for (let b = 0; b < 3; b++) {
        const bh = 3 + Math.random() * 16;
        const by = (Math.random() * C.height) | 0;
        const off = ((Math.random() - 0.5) * 90) | 0;
        X.drawImage(C, 0, by, C.width, bh, off, by, C.width, bh);
        X.fillStyle = 'rgba(190,255,200,' + (0.04 + Math.random() * 0.1).toFixed(3) + ')';
        X.fillRect(0, by, C.width, 1 + Math.random() * 2);
      }
      if (t > REW_TIME) finishRewind(now);
      break;
    }
    case 'enter':
    case 'hold':
    case 'exit':
      if (idx !== -1 && idx >= 0 && ITEMS[idx].type === 'slide') updateSlide(now);
      else updateTitle(now);
      break;
  }

  if (!stuckWarned && now - phaseStart > 30000 &&
      (phase === 'enter' || phase === 'hold' || phase === 'exit' || phase === 'zap' || phase === 'between')) {
    stuckWarned = true;
    console.error('ONEDOPEA: phase stuck at', phase, 'idx', idx, 'vNow', Math.round(now));
  }
  } catch (err) {
    console.error('ONEDOPEA loop error:', err);
  }

  requestAnimationFrame(loop);
}

phaseStart = vNow + START_DELAY;
applyNight();
requestAnimationFrame(loop);
</script>
