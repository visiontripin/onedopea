<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ONEDOPEA</title>
<style>
:root {
  --green: #7dfba4;
  --green-soft: rgba(125, 251, 164, 0.78);
  --green-dim: rgba(125, 251, 164, 0.42);
  --nav-size: clamp(46px, 5.2vw, 66px);
  --nav-offset: clamp(12px, 2.2vw, 30px);
  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  background: #000;
  overflow: hidden;
  user-select: none;
  position: fixed;
  inset: 0;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  font-family: var(--mono);
}
body { transition: filter 0.35s ease; }
body.glitch-mode {
  filter: hue-rotate(180deg) saturate(1.55);
  animation: bodyShake 0.28s infinite linear;
}
body.golden {
  filter: hue-rotate(-72deg) saturate(1.7);
}
@keyframes bodyShake {
  0%, 100% { transform: translate(0, 0); }
  25% { transform: translate(1.5px, -1px); }
  50% { transform: translate(-1.5px, 1px); }
  75% { transform: translate(1px, 1.5px); }
}
canvas { display: block; width: 100%; height: 100%; }

/* CRT glass */
.vignette {
  position: fixed;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  background: radial-gradient(circle at center, transparent 46%, rgba(0, 0, 0, 0.55) 100%);
}
.crt-flicker {
  position: fixed;
  inset: -20%;
  z-index: 110;
  pointer-events: none;
  background: radial-gradient(circle, rgba(125, 251, 164, 0.07), transparent 62%);
  animation: crtFlicker 4s steps(2, end) infinite;
}
@keyframes crtFlicker {
  0%, 100% { opacity: 0.2; }
  50% { opacity: 0.34; }
}
.scanlines {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 120;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px, transparent 2px,
    rgba(0, 0, 0, 0.18) 2px, rgba(0, 0, 0, 0.18) 4px
  );
}

/* ============ ORACLE TITLE ============ */
#oracle-wrap {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 5;
  pointer-events: none;
}
#oracle-wrap::before {
  content: "";
  position: absolute;
  width: 80%;
  height: 40%;
  background: radial-gradient(ellipse, rgba(0, 0, 0, 0.72) 0%, transparent 70%);
}
#oracle-wrap.hidden { visibility: hidden; }
#oracle-wrap.suck { animation: suckContent 1.05s cubic-bezier(0.5, 0, 0.9, 0.4) forwards; }
#oracle {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 0.12em;
  font-family: var(--mono);
  font-size: clamp(29px, 7.7vw, 92px);
  font-weight: 700;
  letter-spacing: 0.12em;
  line-height: 1;
  text-decoration: none;
  cursor: pointer;
  pointer-events: auto;
  text-align: center;
}
#oracle.inactive { pointer-events: none; cursor: default; }
#oracle span {
  display: inline-block;
  min-width: 0.7em;
  text-align: center;
  color: #00c83a;
  text-shadow: 0 0 6px #00ff55;
  opacity: 0;
  will-change: transform, opacity, color;
  transition: color 0.2s, text-shadow 0.2s, opacity 0.18s, transform 0.18s;
}
#oracle span.show { opacity: 1; }
#oracle span.locked {
  color: #d4ffd4;
  text-shadow: 0 0 4px #fff, 0 0 8px #6f6, 0 0 18px #0f0, 0 0 36px #050, 0 0 72px #0a0;
}
#oracle.done { animation: pulse 2.8s ease-in-out infinite; }
#oracle.done:hover span.locked {
  color: #ffffff;
  text-shadow: 0 0 5px #fff, 0 0 12px #9f9, 0 0 28px #0f0, 0 0 55px #0f0;
}
#oracle.onedopea-mode { animation: glitch-skew 0.4s infinite linear alternate-reverse; }
#oracle.onedopea-mode span { text-shadow: 2px 0 #ff00ff, -2px 0 #00ffff; }
#oracle.onedopea-mode span.locked {
  color: #fff;
  text-shadow: 2px 0 #ff00ff, -2px 0 #00ffff, 0 0 10px #0f0, 0 0 20px #0f0, 0 0 40px #0f0;
  animation: glitch-anim 0.15s infinite;
}

/* ============ BOTCONTROL SLIDE ============ */
#slide-wrap {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: grid;
  place-items: center;
  pointer-events: none;
}
#slide-wrap.hidden { visibility: hidden; }
#slide-panel {
  width: min(880px, calc(100vw - 230px));
  min-width: 240px;
  max-height: calc(100dvh - 120px);
  overflow: hidden;
  padding: clamp(24px, 4vw, 52px);
  border-radius: 24px;
  background: linear-gradient(180deg, rgba(6, 14, 9, 0.72), rgba(2, 5, 4, 0.88));
  box-shadow:
    0 0 50px rgba(0, 255, 85, 0.10),
    0 0 120px rgba(0, 255, 85, 0.05);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  text-align: center;
  pointer-events: auto;
  transform-origin: center center;
}
#slide-panel.crt-on { animation: crtOn 460ms cubic-bezier(0.16, 0.84, 0.24, 1) both; }
#slide-panel.crt-off { animation: crtOff 520ms cubic-bezier(0.2, 0.7, 0.15, 1) forwards; }
#slide-panel.crt-off.fast { animation-duration: 340ms; }
#slide-panel.suck { animation: suckContent 1.05s cubic-bezier(0.5, 0, 0.9, 0.4) forwards; }

.badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 30px;
  padding: 6px 12px;
  border-radius: 999px;
  background: rgba(125, 251, 164, 0.06);
  color: var(--green-soft);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
#slide-title {
  margin: 18px 0 12px;
  font-size: clamp(34px, 6.5vw, 72px);
  font-weight: 700;
  line-height: 1.02;
  letter-spacing: 0.04em;
}
#slide-title span {
  display: inline-block;
  min-width: 0.58em;
  text-align: center;
  opacity: 0;
  color: #d4ffd4;
  text-shadow: 0 0 4px #fff, 0 0 8px #6f6, 0 0 18px #0f0, 0 0 36px #050;
  will-change: transform, opacity;
}
#slide-title span.br {
  display: block;
  width: 100%;
  height: 0.35em;
  min-width: 0;
  opacity: 1;
  color: transparent;
  text-shadow: none;
}
#slide-lead {
  max-width: 60ch;
  margin: 0 auto 22px;
  font-size: clamp(13px, 1.45vw, 17px);
  line-height: 1.7;
  color: rgba(220, 255, 232, 0.78);
  text-shadow: 0 0 12px rgba(125, 251, 164, 0.10);
}
#slide-lead span { opacity: 0; transition: opacity 0.1s; }

#slide-cta {
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.45s ease, transform 0.45s ease;
}
#slide-cta.show { opacity: 1; transform: translateY(0); }
#slide-status {
  margin-bottom: 18px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: rgba(125, 251, 164, 0.55);
  text-transform: uppercase;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}
#slide-status .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #0f0;
  box-shadow: 0 0 8px #0f0, 0 0 16px rgba(0, 255, 0, 0.6);
  animation: dotBlink 1.2s steps(1, end) infinite;
}
@keyframes dotBlink {
  0%, 55% { opacity: 1; }
  56%, 100% { opacity: 0.25; }
}
.link-row {
  display: flex;
  gap: 14px;
  justify-content: center;
  align-items: stretch;
  flex-wrap: wrap;
}
.mlink {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.55rem;
  min-height: 46px;
  padding: 0.85rem 1.3rem;
  border-radius: 999px;
  background: rgba(125, 251, 164, 0.07);
  color: var(--green);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  text-decoration: none;
  box-shadow: 0 0 22px rgba(125, 251, 164, 0.12);
  transition:
    transform 0.18s ease, box-shadow 0.18s ease,
    background 0.18s ease, filter 0.18s ease;
}
.mlink::before { content: "↗"; font-size: 1.05em; opacity: 0.9; }
.mlink:hover {
  transform: translateY(-2px);
  background: rgba(125, 251, 164, 0.14);
  box-shadow: 0 0 30px rgba(125, 251, 164, 0.28);
  filter: brightness(1.1);
}
.mlink--alt { color: var(--green-soft); }
.mlink.static { animation: linkStatic 110ms steps(2, jump-none) 1; }
@keyframes linkStatic {
  0% { filter: none; }
  50% { filter: brightness(1.7) contrast(1.4); transform: translateY(-2px) translateX(0.6px); }
  100% { filter: none; }
}
#qr-box {
  width: 58px;
  height: 58px;
  padding: 5px;
  border-radius: 10px;
  background: rgba(0, 0, 0, 0.45);
}
#qr-box img {
  width: 100%;
  height: 100%;
  display: block;
  image-rendering: pixelated;
  border-radius: 5px;
}

/* ============ NAV (‹ ›) ============ */
.tv-nav {
  position: fixed;
  top: 50%;
  z-index: 90;
  width: var(--nav-size);
  height: var(--nav-size);
  display: grid;
  place-items: center;
  border-radius: 18px;
  background: rgba(3, 8, 5, 0.55);
  color: var(--green);
  font: 700 clamp(26px, 3vw, 36px) / 1 var(--mono);
  cursor: pointer;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow:
    0 0 22px rgba(125, 251, 164, 0.16);
  transform: translateY(-50%);
  transition:
    transform 0.18s ease, box-shadow 0.18s ease,
    background 0.18s ease, filter 0.18s ease;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.tv-nav span {
  display: block;
  transform: translateY(-1px);
  text-shadow: 0 0 12px currentColor;
}
.tv-nav::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 36%, rgba(0, 0, 0, 0.18));
  opacity: 0.65;
}
.tv-nav--prev { left: var(--nav-offset); border-radius: 18px 8px 8px 18px; }
.tv-nav--next { right: var(--nav-offset); border-radius: 8px 18px 18px 8px; }
.tv-nav:hover {
  transform: translateY(-50%) scale(1.06);
  background: rgba(5, 14, 8, 0.72);
  box-shadow:
    0 0 30px rgba(125, 251, 164, 0.26);
}
.tv-nav:focus-visible { outline: 2px solid var(--green); outline-offset: 4px; }
.tv-nav.gone { display: none; }
.tv-nav.is-sucked { pointer-events: none; }
.tv-nav--prev.is-sucked { animation: suckPrev 680ms cubic-bezier(0.2, 0.7, 0.15, 1) forwards; }
.tv-nav--next.is-sucked { animation: suckNext 680ms cubic-bezier(0.2, 0.7, 0.15, 1) forwards; }
.tv-nav.nav-in { animation: navIn 420ms cubic-bezier(0.2, 0.7, 0.2, 1) both; }
.tv-nav.pulse { animation: navPulse 240ms ease; }
@keyframes navIn {
  0% { opacity: 0; transform: translateY(-50%) scale(0.5); filter: brightness(3); }
  100% { opacity: 1; transform: translateY(-50%) scale(1); filter: brightness(1); }
}
@keyframes navPulse {
  0% { filter: brightness(1); }
  35% { transform: translateY(-50%) scale(1.07); filter: brightness(2.4); }
  100% { transform: translateY(-50%) scale(1); filter: brightness(1); }
}
@keyframes suckPrev {
  0% { transform: translateY(-50%) scale(1); opacity: 1; filter: brightness(1); }
  12% { transform: translateY(-50%) scale(1.1); filter: brightness(1.9) contrast(1.2); }
  45% {
    transform: translate(calc((50vw - var(--nav-offset) - var(--nav-size) / 2) * 0.45), -50%) scale(0.72, 0.08);
    opacity: 0.95;
    filter: brightness(2.8);
  }
  75% {
    transform: translate(calc((50vw - var(--nav-offset) - var(--nav-size) / 2) * 0.82), -50%) scale(0.22, 0.02);
    opacity: 0.75;
    filter: brightness(4.5);
  }
  100% {
    transform: translate(calc(50vw - var(--nav-offset) - var(--nav-size) / 2), -50%) scale(0.02);
    opacity: 0;
    filter: brightness(8) blur(2px);
  }
}
@keyframes suckNext {
  0% { transform: translateY(-50%) scale(1); opacity: 1; filter: brightness(1); }
  12% { transform: translateY(-50%) scale(1.1); filter: brightness(1.9) contrast(1.2); }
  45% {
    transform: translate(calc((-50vw + var(--nav-offset) + var(--nav-size) / 2) * 0.45), -50%) scale(0.72, 0.08);
    opacity: 0.95;
    filter: brightness(2.8);
  }
  75% {
    transform: translate(calc((-50vw + var(--nav-offset) + var(--nav-size) / 2) * 0.82), -50%) scale(0.22, 0.02);
    opacity: 0.75;
    filter: brightness(4.5);
  }
  100% {
    transform: translate(calc(-50vw + var(--nav-offset) + var(--nav-size) / 2), -50%) scale(0.02);
    opacity: 0;
    filter: brightness(8) blur(2px);
  }
}

/* ============ HUD (пауза / звук) ============ */
#hud {
  position: fixed;
  left: 50%;
  bottom: clamp(12px, 2.5vh, 24px);
  transform: translateX(-50%);
  z-index: 90;
  display: flex;
  align-items: center;
  gap: 10px;
  user-select: none;
}
.hud-btn {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: rgba(0, 0, 0, 0.35);
  color: rgba(125, 251, 164, 0.75);
  font: 700 13px / 1 var(--mono);
  cursor: pointer;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  transition: color 0.18s ease, box-shadow 0.18s ease, opacity 0.3s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.hud-btn:hover { color: #bfffd0; }
.hud-btn:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
#pauseBtn.active {
  color: #eaffef;
  box-shadow: 0 0 16px rgba(125, 251, 164, 0.3);
}
#soundBtn.muted { opacity: 0.35; }
#nightBadge {
  display: none;
  padding: 5px 9px;
  border-radius: 999px;
  background: rgba(125, 251, 164, 0.07);
  color: rgba(125, 251, 164, 0.6);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.25em;
  user-select: none;
}
body.night #nightBadge { display: inline-block; }

/* ============ TV BUG (кнопка ONEDOPEA MODE) ============ */
#bug {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 10px;
  border-radius: 999px;
  background: transparent;
  font: 700 10px / 1 var(--mono);
  letter-spacing: 0.3em;
  color: rgba(125, 251, 164, 0.5);
  text-shadow: 0 0 8px rgba(0, 255, 85, 0.4);
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.2s ease, filter 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}
#bug:hover { color: rgba(125, 251, 164, 0.95); filter: brightness(1.3); }
#bug:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
#bug .bug-dot {
  font-size: 8px;
  color: #0f0;
  animation: bugBlink 2.4s steps(1, end) infinite;
}
@keyframes bugBlink {
  0%, 78% { opacity: 1; }
  79%, 100% { opacity: 0.2; }
}
#bug.flick { animation: bugFlick 140ms steps(2, jump-none) 1; }
@keyframes bugFlick {
  0% { opacity: 1; transform: translateX(0) skewX(0); }
  50% { opacity: 0.25; transform: translateX(2px) skewX(8deg); }
  100% { opacity: 1; transform: translateX(0) skewX(0); }
}

#osd {
  position: fixed;
  left: 20px;
  bottom: 20px;
  z-index: 100;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.22em;
  color: rgba(210, 255, 225, 0.9);
  text-shadow: 0 0 10px rgba(0, 255, 85, 0.8), 0 0 2px rgba(255, 255, 255, 0.8);
  opacity: 0;
  pointer-events: none;
  text-transform: uppercase;
  white-space: nowrap;
}
#osd.show { animation: osdShow 1.5s steps(4, end) 1; }
@keyframes osdShow {
  0% { opacity: 0; }
  5% { opacity: 0.4; }
  9% { opacity: 1; }
  14% { opacity: 0.7; }
  18% { opacity: 1; }
  100% { opacity: 1; }
}

#toast {
  position: fixed;
  left: 50%;
  bottom: clamp(60px, 9vh, 88px);
  transform: translateX(-50%);
  z-index: 100;
  padding: 6px 14px;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.55);
  color: var(--green);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.2em;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
  white-space: nowrap;
}
#toast.show { opacity: 1; }

#mode-label {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 100;
  padding: 6px 14px;
  border-radius: 999px;
  background: rgba(20, 0, 16, 0.6);
  color: #ff9dfb;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-shadow: 0 0 8px #f0f;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  white-space: nowrap;
}
#mode-label.show { opacity: 1; }
#mode-label.gold {
  color: #ffe08a;
  background: rgba(24, 16, 0, 0.6);
  text-shadow: 0 0 8px #fc0;
}

/* ============ AFTERGLOW GHOST ============ */
.ghost-layer {
  position: fixed;
  inset: 0;
  z-index: 7;
  pointer-events: none;
  animation: ghostFade 480ms ease-out forwards;
}
.ghost-layer * {
  animation: none !important;
  transition: none !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
}
@keyframes ghostFade {
  0% { opacity: 0.5; filter: blur(0.5px) brightness(1.3); }
  100% { opacity: 0; filter: blur(4px) brightness(1.7); }
}

/* ============ TYPING ============ */
#typing-el {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: var(--mono);
  font-size: clamp(18px, 4vw, 28px);
  color: #0f0;
  text-shadow: 0 0 6px #0f0;
  z-index: 6;
  pointer-events: none;
  white-space: pre;
  display: none;
  gap: 0;
  flex-wrap: wrap;
  justify-content: center;
}
#typing-el span {
  display: inline-block;
  min-width: 0.6em;
  text-align: center;
  opacity: 0;
  transition: opacity 0.3s, color 0.2s;
}

/* ============ OVERLAYS ============ */
#zap {
  position: fixed;
  inset: 0;
  z-index: 9998;
  pointer-events: none;
  background: #eafff0;
  opacity: 0;
}
#zap.go { animation: zapFlash 240ms linear forwards; }
@keyframes zapFlash {
  0% { opacity: 0; }
  15% { opacity: 0.5; }
  30% { opacity: 0.18; }
  50% { opacity: 0.4; }
  70% { opacity: 0.1; }
  100% { opacity: 0; }
}
#tv-effect {
  position: fixed;
  inset: 0;
  background: #fff;
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  transform-origin: center center;
}
#tv-effect.active { animation: tvTurnOff 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards; }
@keyframes tvTurnOff {
  0% { opacity: 1; transform: scaleY(1) scaleX(1); filter: brightness(1); }
  20% { opacity: 1; transform: scaleY(0.005) scaleX(1); filter: brightness(5); }
  100% { opacity: 0; transform: scaleY(0.005) scaleX(0.005); filter: brightness(0); }
}

/* ============ SHARED KEYFRAMES ============ */
@keyframes pulse {
  0%, 100% { filter: brightness(1) drop-shadow(0 0 8px #0f0); }
  50% { filter: brightness(1.35) drop-shadow(0 0 22px #0f0); }
}
@keyframes glitch-anim {
  0% { transform: translate(0); }
  20% { transform: translate(-3px, 2px); }
  40% { transform: translate(3px, -2px); }
  60% { transform: translate(-2px, 3px); }
  80% { transform: translate(2px, -3px); }
  100% { transform: translate(0); }
}
@keyframes glitch-skew {
  0% { transform: skew(0deg); }
  20% { transform: skew(-3deg); }
  40% { transform: skew(3deg); }
  60% { transform: skew(-1deg); }
  80% { transform: skew(1deg); }
  100% { transform: skew(0deg); }
}
@keyframes crtOn {
  0% { transform: scaleY(0.004) scaleX(0.06); opacity: 0; filter: brightness(9) blur(2px); }
  35% { transform: scaleY(0.08) scaleX(1.04); opacity: 0.75; filter: brightness(3.2); }
  70% { transform: scaleY(0.65) scaleX(1.01); opacity: 0.95; filter: brightness(1.45); }
  100% { transform: scale(1); opacity: 1; filter: brightness(1); }
}
@keyframes crtOff {
  0% { transform: scale(1); opacity: 1; filter: brightness(1); }
  15% { transform: scale(1.015); filter: brightness(1.55) contrast(1.12); }
  55% { transform: scaleY(0.08) scaleX(1.03); opacity: 0.95; filter: brightness(3); }

function unlockAudio() {
  if (!audioCtx) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        audioCtx = new AC();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.5;
        masterGain.connect(audioCtx.destination);
      }
    } catch (e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function sfxOk() {
  return soundOn && audioCtx && audioCtx.state === 'running';
}
function osc(type, f0, f1, t0, dur, peak) {
  const o = audioCtx.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(f0, t0);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak, t0 + Math.min(0.02, dur * 0.25));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g);
  g.connect(masterGain);
  o.start(t0);
  o.stop(t0 + dur + 0.05);
}
function sfxZap() {
  if (!sfxOk()) return;
  const t = audioCtx.currentTime;
  osc('square', 2200, 240, t, 0.09, 0.05);
  const len = Math.floor(0.05 * audioCtx.sampleRate);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const f = audioCtx.createBiquadFilter();
  f.type = 'highpass';
  f.frequency.value = 1400;
  const g = audioCtx.createGain();
  g.gain.value = 0.1;
  src.connect(f); f.connect(g); g.connect(masterGain);
  src.start(t);
}
function sfxPowerOff() {
  if (!sfxOk()) return;
  const t = audioCtx.currentTime;
  osc('sawtooth', 300, 26, t, 0.6, 0.12);
  osc('sine', 55, 40, t + 0.04, 0.5, 0.18);
}
function sfxPowerOn() {
  if (!sfxOk()) return;
  const t = audioCtx.currentTime;
  osc('sine', 48, 780, t, 0.45, 0.09);
  osc('sine', 96, 1560, t + 0.12, 0.3, 0.04);
}
function sfxType() {
  if (!sfxOk()) return;

}
function sfxDecode() {
  if (!sfxOk()) return;
  const t = audioCtx.currentTime;

  }

}

  if (!sfxOk()) return;

/* ============ RAIN LEVEL (↑ / ↓) ============ */
function applyRainLevel() {
  spawnChance = 0.15 + rainLevel * 0.15;

}
function bumpRain(dir) {
  const next = Math.max(0, Math.min(5, rainLevel + dir));
  if (next === rainLevel) return;
  rainLevel = next;
  applyRainLevel();
  showToast('RAIN ' + (dir > 0 ? '▲' : '▼') + ' ' + rainLevel);
}

/* ============ TIME SCALE ([ ] / свайп ↑↓ на телефоне) ============ */
function setTimeScale(dir) {
  const next = Math.max(0.5, Math.min(2.0, Math.round((timeScale + dir * 0.25) * 100) / 100));
  if (next === timeScale) return;
  timeScale = next;
  showToast('TIME ×' + timeScale);
}

function isNightNow() {

  return h >= 23 || h < 7;
}

  const img = nX.createImageData(noiseCv.width, noiseCv.height);

  for (let i = 0; i < d.length; i += 4) {
    const v = (Math.random() * 255) | 0;
    d[i] = (v * 0.35) | 0;
    d[i + 1] = v;
    d[i + 2] = (v * 0.5) | 0;

  if (ghostEl) { ghostEl.remove(); ghostEl = null; }

  document.body.appendChild(g);
  ghostEl = g;
  setTimeout(() => { g.remove(); if (ghostEl === g) ghostEl = null; }, 520);
}

/* ============ SAFE ZONE ============ */
function getSafeZone() {
  if (idx >= 0 && idx < ITEMS.length && ITEMS[idx].type === 'slide' &&
      (phase === 'enter' || phase === 'hold' || phase === 'exit')) {
    const r = slidePanel.getBoundingClientRect();
    if (r.width > 0 && r.height > 0) {
      const p = 24;
      return { x: r.left - p, y: r.top - p, w: r.width + p * 2, h: r.height + p * 2 };
    }
  }
  const rect = oracleEl.getBoundingClientRect();
  if (rect.width > 0 && rect.height > 0) {
    const padding = 30;
    return {
      x: rect.left - padding,
      y: rect.top - padding,
      w: rect.width + padding * 2,
      h: rect.height + padding * 2
    };
  }
  const w = Math.min(C.width * 0.85, 800);
  const h = C.height * 0.30;
  return { x: (C.width - w) / 2, y: (C.height - h) / 2, w, h };
}

/* ============ TITLE SETUP ============ */
function setupTitle(i) {
  const item = i === -1 ? SPECIAL : ITEMS[i];
  slideWrap.classList.add('hidden');
  slidePanel.classList.remove('crt-on', 'crt-off', 'suck', 'fast');
  oracleWrap.classList.remove('hidden', 'suck');
  oracleEl.href = item.url;
  oracleEl.title = item.word.replace('\n', ' ') + ' → ' + item.url;
  oracleEl.setAttribute('aria-label', item.word.replace('\n', ' ') + ' Telegram link');
  oracleEl.classList.remove('done', 'inactive');
  if (i === -1) {
    oracleEl.classList.add('inactive', 'onedopea-mode');
  } else {
    oracleEl.classList.add('inactive');
  }
  oracleEl.innerHTML = '';

  letters = item.word.split('').map(ch => {
    const span = document.createElement('span');
    if (ch === '\n') {
      span.style.display = 'block';
      span.style.width = '100%';
      span.style.height = '0.5em';
      span.dataset.locked = '1';
      span.dataset.hidden = '1';
      span.classList.add('show');
    } else {
      span.dataset.target = ch;
      span.dataset.locked = '0';
      span.dataset.hidden = '0';
      span.textContent = '';
    }
    oracleEl.appendChild(span);
    return span;
  });
  typingEl.style.display = 'none';
}

function hideTitle() {
  makeGhost(oracleWrap);
  oracleEl.innerHTML = '';
  oracleEl.classList.remove('done', 'onedopea-mode');
  oracleWrap.classList.add('hidden');
}

/* ============ SLIDE SETUP ============ */
function setupSlide() {
  oracleEl.innerHTML = '';
  oracleEl.classList.remove('done', 'onedopea-mode');
  oracleWrap.classList.add('hidden');
  slideWrap.classList.remove('hidden');
  slidePanel.classList.remove('crt-on', 'crt-off', 'suck', 'fast');
  slideBadge.textContent = SLIDE_BADGE;

  slideTitle.innerHTML = '';
  h1Spans = ITEMS[0].word.split('').map(ch => {
    const span = document.createElement('span');
    if (ch === '\n') {
      span.dataset.role = 'br';
      span.dataset.locked = '1';
    } else {
      span.dataset.target = ch;
      span.dataset.locked = '0';
    }
    slideTitle.appendChild(span);
    return span;
  });

  slideLead.innerHTML = '';
  leadSpans = SLIDE_LEAD.split('').map(ch => {
    const span = document.createElement('span');
    span.dataset.target = ch;
    slideLead.appendChild(span);
    return span;
  });
  currentLeadIdx = 0;
  leadStartAt = vNow;
  ctaEl.classList.remove('show');

  void slidePanel.offsetWidth;
  slidePanel.classList.add('crt-on');
}

function hideSlide() {
  makeGhost(slideWrap);
  slidePanel.classList.remove('crt-on', 'crt-off', 'suck', 'fast');
  slideWrap.classList.add('hidden');
}

/* ============ CYCLE MACHINE ============ */
function startEnter(i, now) {
  idx = i;
  phase = 'enter';
  phaseStart = now;
  if (i === -1 || ITEMS[i].type === 'title') setupTitle(i);
  else setupSlide();
  switchCount++;
  if (i === -1) {
    sfxGlitch();
    showOsd('CH -- // ONEDOPEA');
  } else {
    const item = ITEMS[i];
    if (i === 0) sfxPowerOn();
    else sfxDecode();
    showOsd('CH 0' + (i + 1) + ' // ' + item.word.replace('\n', ' ').toUpperCase());
  }
  updateNavVisibility();
}

function updateNavVisibility() {
  if (idx === -1) return;
  if (navPrev.classList.contains('gone')) {
    [navPrev, navNext].forEach(b => {
      b.classList.remove('gone', 'is-sucked', 'pulse');
      b.classList.add('nav-in');
    });
    setTimeout(() => {
      navPrev.classList.remove('nav-in');
      navNext.classList.remove('nav-in');
    }, 460);
  }
}

function goToZap(t, now) {
  pendingIdx = t;
  phase = 'zap';
  phaseStart = now;
  sfxZap();
  buzz(12);
  zapEl.classList.remove('go');
  void zapEl.offsetWidth;
  zapEl.classList.add('go');
}

function finishExit(now) {
  if (manualTarget !== null) {
    const t = manualTarget;
    manualTarget = null;
    fastExit = false;
    goToZap(t, now);
    return;
  }
  fastExit = false;
  if (idx === -1) {
    pendingIdx = 0;
    phase = 'between';
    phaseStart = now + BETWEEN_WORDS_TIME;
    rainActive = true;
    cycleFallMultiplier = Math.min(16.0, cycleFallMultiplier * 2);
    return;
  }
  if (idx === ITEMS.length - 1) {
    triggerTvOff(now);
    return;
  }
  goToZap((idx + 1) % ITEMS.length, now);
}

function triggerTvOff(now) {
  phase = 'tv_collapse';
  collapseStart = now;
  rainActive = false;
  manualTarget = null;
  fastExit = false;
  sfxPowerOff();
  buzz(30);

  drops.forEach(d => { d.collapsing = true; d.vx = 0; d.vy = 0; });
  crumbs.forEach(c => { c.collapsing = true; });

  if (idx >= 0 && idx < ITEMS.length && ITEMS[idx].type === 'slide') {
    slidePanel.classList.add('suck');
  } else if (idx !== -2) {
    oracleWrap.classList.add('suck');
  }

  [navPrev, navNext].forEach(b => {
    b.classList.remove('nav-in', 'pulse');
    b.classList.add('is-sucked');
  });
  setTimeout(() => {
    navPrev.classList.add('gone');
    navNext.classList.add('gone');
  }, 720);
}

/* ============ SLIDE UPDATE ============ */
function typeLead(t) {
  const showCount = Math.max(0, Math.floor((vNow - leadStartAt - LEAD_DELAY_MS) / LEAD_CHAR_MS));
  if (showCount > currentLeadIdx && currentLeadIdx < leadSpans.length) {
    for (let i = currentLeadIdx; i < showCount; i++) {
      leadSpans[i].textContent = leadSpans[i].dataset.target;
      leadSpans[i].style.opacity = '1';
    }
    currentLeadIdx = showCount;
    sfxType();
  }
  if (t > CTA_SHOW_MS) ctaEl.classList.add('show');
}

function updateSlide(now) {
  if (phase === 'enter') {
    const t = now - phaseStart;
    h1Spans.forEach((el, i) => {
      if (el.dataset.role === 'br' || el.dataset.locked === '1') return;
      const delay = i * H1_STEP;
      if (t < delay) return;
      el.style.opacity = '1';
      el.textContent = randomGlyph();
      if (t > delay + H1_SCRAMBLE_TIME) {
        el.dataset.locked = '1';
        el.textContent = el.dataset.target;
      }
    });
    typeLead(t);
    if (t > SLIDE_ENTER_MS) {
      phase = 'hold';
      phaseStart = now;
    }
    return;
  }

  if (phase === 'hold') {
    typeLead(now - phaseStart + SLIDE_ENTER_MS);
    h1Spans.forEach(el => {
      if (el.dataset.role === 'br') return;
      if (el.dataset.locked === '1' && el.dataset.target && Math.random() < 0.015) {
        const target = el.dataset.target;
        el.textContent = randomGlyph();
        setTimeout(() => {
          if (phase === 'hold' && el.dataset.target === target) el.textContent = target;
        }, 40 + Math.random() * 60);
      }
    });
    if (Math.random() < 0.04) {
      const vis = [];
      leadSpans.forEach(s => { if (s.style.opacity === '1') vis.push(s); });
      if (vis.length) {
        const s = vis[(Math.random() * vis.length) | 0];
        const tg = s.dataset.target;
        s.textContent = randomGlyph();
        s.style.color = '#0a0';
        setTimeout(() => { s.textContent = tg; s.style.color = ''; }, 50);
      }
    }
    if (now - phaseStart > SLIDE_HOLD_MS) {
      phase = 'exit';
      phaseStart = now;
      slidePanel.classList.remove('crt-on');
      void slidePanel.offsetWidth;
      slidePanel.classList.add('crt-off');
    }
    return;
  }

  if (phase === 'exit') {
    const t = now - phaseStart;
    const step = fastExit ? 8 : 24;
    const hideMs = fastExit ? 140 : 260;
    const total = fastExit ? 380 : SLIDE_EXIT_MS;
    h1Spans.forEach((el, i) => {
      if (el.dataset.role === 'br' || el.dataset.gone === '1') return;
      const d = i * step;
      if (t < d) return;
      el.textContent = randomGlyph();
      if (t > d + hideMs) {
        el.style.opacity = '0';
        el.dataset.gone = '1';
      }
    });
    leadSpans.forEach((el, i) => {
      if (el.dataset.gone === '1') return;
      const d = (leadSpans.length - 1 - i) * (fastExit ? 3 : 6);
      if (t < d) return;
      el.style.opacity = '0';
      el.dataset.gone = '1';
    });
    if (t > total) {
      hideSlide();
      finishExit(now);
    }
  }
}

/* ============ TITLE UPDATE ============ */
function updateTitle(now) {
  if (phase === 'enter') {
    const t = now - phaseStart;
    letters.forEach((el, i) => {
      if (el.dataset.locked === '1') return;
      const delay = i * LETTER_STEP;
      if (t < delay) return;
      el.classList.add('show');
      el.textContent = randomGlyph();
      if (t > delay + APPEAR_SCRAMBLE_TIME) {
        el.dataset.locked = '1';
        el.textContent = el.dataset.target;
        el.classList.add('locked');
      }
    });
    if (letters.every(el => el.dataset.locked === '1')) {
      phase = 'hold';
      phaseStart = now;
      oracleEl.classList.remove('inactive');
      oracleEl.classList.add('done');
    }
    return;
  }

  if (phase === 'hold') {
    const holdDuration = idx === -1 ? SPECIAL_HOLD_TIME : HOLD_TIME;
    if (idx !== -1) {
      letters.forEach(el => {
        if (el.dataset.locked === '1' && el.dataset.hidden === '0' && Math.random() < 0.02) {
          const target = el.dataset.target;
          el.textContent = randomGlyph();
          setTimeout(() => {
            if (phase === 'hold' && el.dataset.target === target) el.textContent = target;
          }, 40 + Math.random() * 60);
        }
      });
    } else {
      letters.forEach(el => {
        if (el.dataset.role === 'br') return;
        if (Math.random() < 0.06) {
          const target = el.dataset.target;
          el.textContent = randomGlyph();
          el.style.color = Math.random() > 0.5 ? '#ff00ff' : '#00ffff';
          setTimeout(() => {
            if (phase === 'hold') { el.textContent = target; el.style.color = ''; }
          }, 60);
        }
      });
    }
    if (now - phaseStart > holdDuration) {
      phase = 'exit';
      phaseStart = now;
      oracleEl.classList.remove('done', 'onedopea-mode');
      oracleEl.classList.add('inactive');
      letters.forEach(el => { if (el.dataset.locked !== '1') el.dataset.hidden = '0'; });
    }
    return;
  }

  if (phase === 'exit') {
    const t = now - phaseStart;
    const step = fastExit ? 40 : LETTER_STEP;
    const scrambleTime = fastExit ? 200 : (idx === -1 ? DISAPPEAR_SCRAMBLE_TIME * 0.8 : DISAPPEAR_SCRAMBLE_TIME);
    letters.forEach((el, i) => {
      if (el.dataset.hidden === '1') return;
      const delay = i * step;
      if (t < delay) return;
      el.classList.remove('locked');
      el.textContent = randomGlyph();
      if (t > delay + scrambleTime) {
        el.classList.remove('show');
        el.dataset.hidden = '1';
      }
    });
    if (letters.every(el => el.dataset.hidden === '1')) {
      if (idx === ITEMS.length - 1 && manualTarget === null) {
        finishExit(now);
        return;
      }
      hideTitle();
      finishExit(now);
    }
  }
}

/* ============ TYPING ============ */
function setupTyping(now) {
  typingEl.innerHTML = '';
  typingSpans = TYPING_STRING.split('').map(ch => {
    const span = document.createElement('span');
    span.dataset.target = ch;
    span.dataset.hidden = '0';
    span.textContent = '';
    span.style.opacity = '0';
    typingEl.appendChild(span);
    return span;
  });
  typingState = 'typing';
  currentTypingIndex = 0;
  typingStartTime = now;
  typingEl.style.display = 'flex';
}

function updateTyping(now) {
  if (typingState === 'typing') {
    const elapsed = now - typingStartTime;
    const charsToShow = Math.floor(elapsed / 70);
    if (charsToShow > currentTypingIndex && currentTypingIndex < typingSpans.length) {
      currentTypingIndex = charsToShow;
      for (let i = 0; i < currentTypingIndex; i++) {
        typingSpans[i].textContent = typingSpans[i].dataset.target;
        typingSpans[i].style.opacity = '1';
      }
      sfxType();
    }
    if (currentTypingIndex >= typingSpans.length) {
      typingState = 'holding';
      typingStartTime = now;
    }
  } else if (typingState === 'holding') {
    if (now - typingStartTime > 1800) {
      typingState = 'crumbling';
      typingStartTime = now;
    }
  } else if (typingState === 'crumbling') {
    const elapsed = now - typingStartTime;
    typingSpans.forEach((span, i) => {
      const delay = i * 25;
      if (elapsed > delay && span.dataset.hidden === '0') {
        span.dataset.hidden = '1';
        span.textContent = randomGlyph();
        span.style.color = '#0a0';
        span.style.opacity = '0';
      }
    });
    const allHidden = typingSpans.every(s => s.dataset.hidden === '1');
    if (allHidden && elapsed > typingSpans.length * 25 + 600) {
      typingState = 'idle';
      pendingIdx = -1;
      phase = 'between';
      phaseStart = now + 400;
    }
  }
}

/* ============ NAV ============ */
function canNavigate() {
  return phase === 'hold' && idx >= 0 && idx < ITEMS.length;
}
function pulseNav(btn) {
  btn.classList.remove('pulse');
  void btn.offsetWidth;
  btn.classList.add('pulse');
  setTimeout(() => btn.classList.remove('pulse'), 260);
}
function startManualExit(target) {
  manualTarget = target;
  fastExit = true;
  phase = 'exit';
  phaseStart = vNow;
  if (ITEMS[idx].type === 'slide') {
    slidePanel.classList.remove('crt-on');
    void slidePanel.offsetWidth;
    slidePanel.classList.add('crt-off', 'fast');
  }
}
function doNext(triggerBtn) {
  if (!canNavigate()) return;
  pulseNav(triggerBtn);
  if (idx === ITEMS.length - 1) {
    triggerTvOff(vNow);
    return;
  }
  startManualExit(idx + 1);
}
function doPrev(triggerBtn) {
  if (!canNavigate()) return;
  pulseNav(triggerBtn);
  startManualExit((idx + ITEMS.length - 1) % ITEMS.length);
}
navPrev.addEventListener('click', () => doPrev(navPrev));
navNext.addEventListener('click', () => doNext(navNext));

/* Свайп: ←→ навигация, ↑↓ — скорость времени (телефон) */
let touchStartX = 0, touchStartY = 0;
document.addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
}, { passive: true });
document.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].screenX - touchStartX;
  const dy = e.changedTouches[0].screenY - touchStartY;
  if (Math.abs(dy) > 45 && Math.abs(dy) > Math.abs(dx)) {
    setTimeScale(dy < 0 ? 1 : -1);
    return;
  }
  if (Math.abs(dx) < 45) return;
  if (dx < 0) doNext(navNext);
  else doPrev(navPrev);
}, { passive: true });

/* ============ MATRIX RAIN ============ */
function resize() {
  C.width = window.innerWidth;
  C.height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  applyRainLevel();
}
resize();
addEventListener('resize', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

function glyphAt(d, i) {
  return GLYPHS[((d.glyph - i) % GLYPHS.length + GLYPHS.length) % GLYPHS.length];
}
function spawnDrop() {
  drops.push({
    x: Math.floor(Math.random() * (C.width / S)) * S,
    y: -S, startY: -S,
    speed: 1.2 + Math.random() * 2.2,
    glyph: (Math.random() * GLYPHS.length) | 0,
    shattered: false, collapsing: false,
    vx: 0, vy: 0, alpha: 1
  });
}
function shatterDrop(d) {
  d.shattered = true;
  for (let i = 0; i < N; i++) {
    const py = d.y - i * S;
    if (py < -S || py > C.height + S) continue;
    const count = 4 + ((Math.random() * 4) | 0);
    for (let j = 0; j < count; j++) {
      crumbs.push({
        x: d.x + Math.random() * S, y: py + Math.random() * S,
        vx: (Math.random() - 0.5) * 7, vy: (Math.random() - 0.5) * 6 - 1,
        life: 1, decay: 0.012 + Math.random() * 0.02,
        w: 1 + Math.random() * 4, h: 1 + Math.random() * 4,
        isChar: Math.random() < 0.35, ch: glyphAt(d, i),
        chSize: S * (0.28 + Math.random() * 0.5),
        rot: (Math.random() - 0.5) * 4, rotV: (Math.random() - 0.5) * 0.28,
        collapsing: false
      });
    }
  }
}
function updateDrop(d) {
  if (d.collapsing) {
    const cx = C.width / 2, cy = C.height / 2;
    const dx = cx - d.x, dy = cy - d.y;
    const dist = Math.hypot(dx, dy) || 1;
    const elapsed = vNow - collapseStart;
    const accel = 0.8 + elapsed / 800;
    d.vx = (d.vx || 0) + (dx / dist) * accel;
    d.vy = (d.vy || 0) + (dy / dist) * accel;
    d.vx *= 0.94; d.vy *= 0.94;
    d.x += d.vx * timeScale; d.y += d.vy * timeScale;
    d.alpha = Math.min(1, dist / 100);
    return dist > 15;
  }
  if (!d.shattered) {
    const sz = getSafeZone();
    if (d.y >= sz.y && d.y <= sz.y + sz.h && d.x >= sz.x && d.x <= sz.x + sz.w) shatterDrop(d);
  }
  if (d.shattered) { d.alpha -= 0.07; return d.alpha > 0; }
  d.y += d.speed * timeScale;
  d.glyph = (d.glyph + 1) % GLYPHS.length;
  if (d.y - d.startY >= N * S * cycleFallMultiplier) shatterDrop(d);
  return d.y - N * S < C.height + S;
}
function updateCrumb(c) {
  if (c.collapsing) {
    const cx = C.width / 2, cy = C.height / 2;
    const dx = cx - c.x, dy = cy - c.y;
    const dist = Math.hypot(dx, dy) || 1;
    const elapsed = vNow - collapseStart;
    const accel = 1.5 + elapsed / 400;
    c.vx += (dx / dist) * accel; c.vy += (dy / dist) * accel;
    c.vx *= 0.92; c.vy *= 0.92;
    c.x += c.vx * timeScale; c.y += c.vy * timeScale;
    c.life = Math.min(1, dist / 60);
    return dist > 10;
  }
  c.x += c.vx * timeScale; c.y += c.vy * timeScale;
  c.vy += 0.16 * timeScale; c.vx *= 0.985;
  c.rot += c.rotV; c.life -= c.decay;
  return c.life > 0;
}
function drawDrop(d) {
  X.font = S + 'px monospace';
  const depth = 0.45 + ((d.speed - 1.2) / 2.2) * 0.8;
  const ox = parX * depth, oy = parY * depth;
  for (let i = 0; i < N; i++) {
    const py = d.y - i * S;
    if (py < -S || py > C.height) continue;
    const ch = glyphAt(d, i);
    if (i === 0 && !d.shattered) {
      X.shadowColor = '#0F0'; X.shadowBlur = 8;
      X.fillStyle = `rgba(200,255,200,${d.alpha})`;
    } else {
      X.shadowBlur = 0;
      const f = Math.max(0, 1 - i / N);
      const g = (255 * f * d.alpha) | 0;
      X.fillStyle = `rgba(0,${g},0,${d.alpha})`;
    }
    X.fillText(ch, d.x + ox, py + oy);
  }
  X.shadowBlur = 0;
}
function drawCrumb(c) {
  const a = Math.max(0, c.life);
  const g = (220 * a) | 0;
  X.save();
  X.translate(c.x, c.y);
  X.rotate(c.rot);
  if (c.isChar) {
    X.font = c.chSize + 'px monospace';
    X.fillStyle = `rgba(0,${g},40,${a})`;
    X.fillText(c.ch, 0, 0);
  } else {
    X.fillStyle = `rgba(0,${g},30,${a})`;
    X.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
  }
  X.restore();
}

/* ============ MAIN LOOP ============ */
function loop(rawNow) {
  const dt = Math.min(250, Math.max(0, rawNow - lastRaw));
  lastRaw = rawNow;
  vNow += paused ? 0 : dt * timeScale;
  const now = vNow;

  parX += (mouseNX * 7 - parX) * 0.04;
  parY += (mouseNY * 5 - parY) * 0.04;

  X.fillStyle = '#000';
  X.fillRect(0, 0, C.width, C.height);

  const spChance = spawnChance * (nightOn ? 1.4 : 1);
  if (rainActive && Math.random() < spChance && drops.length < maxDrops) spawnDrop();

  for (let i = drops.length - 1; i >= 0; i--) {
    if (updateDrop(drops[i])) drawDrop(drops[i]);
    else drops.splice(i, 1);
  }
  if (crumbs.length > MAX_CRUMBS) crumbs.splice(0, crumbs.length - MAX_CRUMBS);
  for (let i = crumbs.length - 1; i >= 0; i--) {
    if (updateCrumb(crumbs[i])) drawCrumb(crumbs[i]);
    else crumbs.splice(i, 1);
  }

  switch (phase) {
    case 'wait':
      if (now >= phaseStart) startEnter(0, now);
      break;
    case 'tv_collapse': {
      const allGone = drops.length === 0 && crumbs.length === 0;
      if (allGone || now - collapseStart > 1500) {
        phase = 'tv_flash';
        const gen = ++tvFlashGen;
        tvOverlay.classList.add('active');
        setTimeout(() => {
          tvOverlay.classList.remove('active');
          if (gen === tvFlashGen) {
            phase = 'typing';
            setupTyping(vNow);
          }
        }, 600);
      }
      break;
    }
    case 'typing':
      updateTyping(now);
      break;
    case 'between':
      if (now >= phaseStart) startEnter(pendingIdx, now);
      break;
    case 'zap':
      if (now - phaseStart > ZAP_MS) startEnter(pendingIdx, now);
      break;
    case 'enter':
    case 'hold':
    case 'exit':
      if (idx !== -1 && idx >= 0 && ITEMS[idx].type === 'slide') updateSlide(now);
      else updateTitle(now);
      break;
  }

  requestAnimationFrame(loop);
}

phaseStart = vNow + START_DELAY;
applyNight();
requestAnimationFrame(loop);
</script>
