name: Lighthouse CI

on:
  push:
    branches: [main, arena/6295eef6-onedopea]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate content and run DOM tests
        run: npm test
      - name: Lighthouse accessibility, SEO and performance
        run: npx --yes @lhci/cli@0.15.x autorun --config=lighthouserc.json
