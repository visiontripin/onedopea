name: Rebuild GitHub Pages

# Pages публикует ветку main из корня, но классический (legacy) билдер не всегда
# перезапускается на изменения только в новых файлах. Этот воркфлоу принудительно
# запускает сборку Pages после пуша в main и/или по ручному запуску.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-rebuild
  cancel-in-progress: true

jobs:
  request-build:
    runs-on: ubuntu-latest
    steps:
      - name: Request a new Pages build for main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering Pages build for ${{ github.repository }}"
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" \
            -w '\nHTTP %{http_code}\n'
