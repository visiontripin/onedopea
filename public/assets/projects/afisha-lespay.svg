    <filter id="afLpSh" x="80" y="64" width="740" height="440" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#143B24" flood-opacity=".13"/>
