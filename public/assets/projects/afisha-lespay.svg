  <text x="154" y="316" fill="#546E60" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="11.5">• Отметка «Иду» и шеринг</text>
  <text x="154" y="338" fill="#546E60" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="11.5">• Экспорт в календарь</text>

  <rect x="351" y="186" width="198" height="178" rx="18" fill="#11281C"/>
