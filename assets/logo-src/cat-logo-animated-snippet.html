      return st;
    }

    if (t < 6.75) {
      st.phaseId = 3;
      st.phaseName = "IV. Запрыгивание на поверхность полки";
      st.sit = 0.0;

      if (t < 4.60) {
        const u = easeInOutCubic((t - 4.35) / 0.25);
        st.x = 245;
        st.y = Y_FLOOR - 14 * Math.sin(u * Math.PI);
        const cosFlip = Math.cos(u * Math.PI);
        st.dir = cosFlip >= 0 ? 1 : -1;
        st.scaleX = Math.max(0.22, Math.abs(cosFlip));
        st.crouch = 0.35 * Math.sin(u * Math.PI);
        st.headDx = -12; st.headDy = 16;
        st.tailRot = 16;
      } else if (t < 5.45) {
        const u = (t - 4.60) / 0.85;
        st.dir = -1;
        st.x = lerp(245, 1165, easeInOutCubic(u));
        const cyc = u * 3.0;
        const hop = Math.abs(Math.sin(cyc * Math.PI));
        st.y = Y_FLOOR - 18 * hop;
        st.arch = 0.35 * Math.sin(cyc * Math.PI * 2);
        st.bodyRot = -5 * Math.cos(cyc * Math.PI * 2);

        const lFf = sampleWalkLeg(cyc + 0.0, 26, 20);
        const lFn = sampleWalkLeg(cyc + 0.15, 26, 20);
        const lHf = sampleWalkLeg(cyc + 0.50, 26, 20);
        const lHn = sampleWalkLeg(cyc + 0.65, 26, 20);
        st.ffRot = lFf.rot; st.ffKnee = lFf.knee; st.ffLift = lFf.lift;
        st.fnRot = lFn.rot; st.fnKnee = lFn.knee; st.fnLift = lFn.lift;
        st.hfRot = lHf.rot; st.hfKnee = lHf.knee; st.hfLift = lHf.lift;
        st.hnRot = lHn.rot; st.hnKnee = lHn.knee; st.hnLift = lHn.lift;
        st.headDx = -12; st.headDy = 14;
        st.tailRot = 18 + 6 * Math.sin(cyc * Math.PI * 2);
      } else if (t < 5.70) {
        const u = easeInOutCubic((t - 5.45) / 0.25);
        st.x = 1165;
        st.y = Y_FLOOR - 12 * Math.sin(u * Math.PI);
        const cosFlip = -Math.cos(u * Math.PI);
        st.dir = cosFlip >= 0 ? 1 : -1;
        st.scaleX = Math.max(0.22, Math.abs(cosFlip));
        st.crouch = 0.35 * Math.sin(u * Math.PI);
        st.headDx = -12; st.headDy = 16;
        st.tailRot = 16;
      } else if (t < 6.08) {
        const u = easeInOutCubic((t - 5.70) / 0.38);
        st.x = 1165;
        st.y = Y_FLOOR;
        st.crouch = 0.98 * u;
        st.arch = -0.35 * u;
        st.headRot = 12 * u;
        st.headDx = -10;
        st.headDy = lerp(16, 6, u);
        st.earPerk = 0.65 * u;
        st.tailRot = lerp(16, 24, u);
        st.tailWave = 5 * Math.sin(u * Math.PI * 2);
      } else if (t < 6.56) {
        const u = (t - 6.08) / 0.48;
        st.x = lerp(1165, 960, easeInOutCubic(u));
        const yBase = lerp(Y_FLOOR, Y_SHELF, easeOutCubic(u));
        const highArc = -115 * 4 * u * (1 - u);
        st.y = yBase + highArc;

        const leapS = Math.sin(u * Math.PI);
        st.arch = 0.82 * leapS;
        st.bodyRot = lerp(22, -8, u) * leapS;
        st.scaleX = 1 + 0.07 * leapS;
        st.scaleY = 1 - 0.05 * leapS;

        st.ffRot = 38 * leapS; st.ffKnee = -16 * (1 - u);
        st.fnRot = 28 * leapS; st.fnKnee = -12 * (1 - u);
        st.hfRot = lerp(-38, 18, smoothstep(0.35, 0.95, u)) * leapS;
        st.hnRot = lerp(-28, 14, smoothstep(0.35, 0.95, u)) * leapS;

        st.headRot = lerp(12, -4, u);
        st.headDx = -10; st.headDy = 8;
        st.earPerk = 0.6 * leapS;
        st.tailRot = 14 + 6 * leapS;
        st.tailTip = 6 * leapS;
      } else {
        const u = (t - 6.56) / 0.19;
        const sq = Math.sin(u * Math.PI);
        st.x = 960;
        st.y = Y_SHELF;
        st.crouch = 0.55 * sq;
        st.arch = -0.22 * sq;
        st.headDx = -12; st.headDy = 16;
        st.tailRot = 14 + 8 * sq;
      }
      return st;
    }

    if (t < 9.30) {
      st.phaseId = 4;
      st.phaseName = "V. Прогулка по поверхности полки";
      st.sit = 0.0;
      st.y = Y_SHELF;

      const u = (t - 6.75) / (9.30 - 6.75);
      const walkProgress = smoothstep(0.0, 1.0, u);
      st.x = lerp(960, X_HOME, walkProgress);

      const env = smoothstep(0.0, 0.10, u) * (1 - smoothstep(0.86, 1.0, u));
      const cycles = u * 3.5;

      const lFn = sampleWalkLeg(cycles + 0.00, 21 * env, 18 * env);
      const lHf = sampleWalkLeg(cycles + 0.25, 20 * env, 16 * env);
      const lFf = sampleWalkLeg(cycles + 0.50, 21 * env, 18 * env);
      const lHn = sampleWalkLeg(cycles + 0.75, 20 * env, 16 * env);

      st.fnRot = lFn.rot; st.fnKnee = lFn.knee; st.fnLift = lFn.lift;
      st.hfRot = lHf.rot; st.hfKnee = lHf.knee; st.hfLift = lHf.lift;
      st.ffRot = lFf.rot; st.ffKnee = lFf.knee; st.ffLift = lFf.lift;
      st.hnRot = lHn.rot; st.hnKnee = lHn.knee; st.hnLift = lHn.lift;

      const bob = Math.sin(cycles * Math.PI * 4) * env;
      const sway = Math.sin(cycles * Math.PI * 2) * env;
      st.arch = 0.10 + 0.06 * bob;
      st.crouch = 0.06 * (1 + bob) * env;
      st.headRot = -2.5 + 2.0 * bob;
      st.headDx = -12;
      st.headDy = 17 + 3.5 * bob;
      st.earPerk = 0.35 * env;
      st.tailRot = 13 + 5 * sway;
      st.tailTip = 4 * Math.cos(cycles * Math.PI * 2) * env;
      st.tailWave = 4 * sway;
      return st;
    }

    st.phaseId = 5;
    st.phaseName = "VI. Возвращение в исходное положение сидя (1:1)";
    st.x = X_HOME;
    st.y = Y_SHELF;

    if (t < 10.25) {
      const u = easeInOutCubic((t - 9.30) / 0.95);
      st.sit = u;
      const settleS = Math.sin(u * Math.PI);
      st.arch = 0.14 * settleS * (1 - u);
      st.headRot = lerp(-2.5, 0, u) + 2.5 * settleS;
      st.headDx = lerp(-12, 0, u);
      st.headDy = lerp(17, 0, u);
      st.earPerk = 0.3 * settleS;
      st.tailRot = lerp(13, 0, u);
      st.tailTip = 4 * settleS * (1 - u);
    } else {
      st.sit = 1.0;
      st.exactLock = true;
    }
    return st;
  }

  const passHalo = document.getElementById("cat-pass-halo");
  const passFill = document.getElementById("cat-pass-fill");
  const passHoles = document.getElementById("cat-pass-holes");
  const passCreases = document.getElementById("cat-pass-creases");
  const exactPdfPath = document.getElementById("cat-exact-pdf-path");

  const compGroup = document.getElementById("cat-world-companion");
  const compLocal = document.getElementById("cat-local-companion");
  const passHaloB = document.getElementById("cat-pass-halo-b");
  const passFillB = document.getElementById("cat-pass-fill-b");
  const passHolesB = document.getElementById("cat-pass-holes-b");
  const passCreasesB = document.getElementById("cat-pass-creases-b");

  const catWorld = document.getElementById("cat-world");
  const catLocal = document.getElementById("cat-local");
  const cameraRig = document.getElementById("camera-rig");
  const shadowShelf = document.getElementById("cat-shadow-shelf");
  const shadowFloor = document.getElementById("cat-shadow-floor");
  const fxLayer = document.getElementById("fx-layer");

  const phaseLabelEl = document.getElementById("phase-label");
  const poseBadgeEl = document.getElementById("pose-badge");
  const scrubberEl = document.getElementById("timeline-scrubber");
  const timeReadoutEl = document.getElementById("time-readout");
  const phaseStepBtns = Array.from(document.querySelectorAll(".phase-step-btn"));

  let currentStyle = "outline";
  let currentCam = "stage";
  let speedMult = 1.0;
  let isPlaying = true;
  let animTime = 0.0;
  let lastNow = performance.now();
  let lastTriggerBand = -1;

  function makePathEl(parent) {
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    parent.appendChild(p);
    return p;
  }

  const pHalo = makePathEl(passHalo);
  const pFill = makePathEl(passFill);
  const pHoles = makePathEl(passHoles);
  const pCreases = makePathEl(passCreases);

  const pHaloB = makePathEl(passHaloB);
  const pFillB = makePathEl(passFillB);
  const pHolesB = makePathEl(passHolesB);
  const pCreasesB = makePathEl(passCreasesB);

  function applyCatStyleToLayers(geom, mode, haloEl, fillEl, holesEl, creasesEl) {
    haloEl.setAttribute("d", geom.outerD);
    fillEl.setAttribute("d", geom.outerD);
    holesEl.setAttribute("d", geom.holesD);
    creasesEl.setAttribute("d", geom.creasesD);

    if (mode === "outline") {
      haloEl.setAttribute("fill", "#1a1a18");
      haloEl.setAttribute("stroke", "#1a1a18");
      haloEl.setAttribute("stroke-width", "6.4");
      haloEl.setAttribute("stroke-linejoin", "round");
      haloEl.setAttribute("stroke-linecap", "round");

      fillEl.setAttribute("fill", "#fefefe");
      fillEl.setAttribute("stroke", "none");

      holesEl.setAttribute("fill", "#fefefe");
      holesEl.setAttribute("stroke", "#1a1a18");
      holesEl.setAttribute("stroke-width", "3.2");
      holesEl.setAttribute("stroke-linejoin", "round");

      creasesEl.setAttribute("fill", "none");
      creasesEl.setAttribute("stroke", "#1a1a18");
      creasesEl.setAttribute("stroke-width", "3.4");
      creasesEl.setAttribute("stroke-linecap", "round");
      creasesEl.setAttribute("stroke-linejoin", "round");
    } else {
      const holeBg = currentStyle === "silhouette" ? "#e7edf9" : "#ffffff";
      haloEl.setAttribute("fill", "#ffffff");
      haloEl.setAttribute("stroke", "#ffffff");
      haloEl.setAttribute("stroke-width", "18");
      haloEl.setAttribute("stroke-linejoin", "round");
      haloEl.setAttribute("stroke-linecap", "round");

      fillEl.setAttribute("fill", "#2a3984");
      fillEl.setAttribute("stroke", "#2a3984");
      fillEl.setAttribute("stroke-width", "2.0");
      fillEl.setAttribute("stroke-linejoin", "round");

      holesEl.setAttribute("fill", holeBg);
      holesEl.setAttribute("stroke", "none");

      creasesEl.setAttribute("fill", "none");
      creasesEl.setAttribute("stroke", holeBg);
      creasesEl.setAttribute("stroke-width", "3.6");
      creasesEl.setAttribute("stroke-linecap", "round");
      creasesEl.setAttribute("stroke-linejoin", "round");
    }
  }

  function spawnRipple(x, y, color) {
    const c = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
    c.setAttribute("cx", x.toFixed(1));
    c.setAttribute("cy", y.toFixed(1));
    c.setAttribute("rx", "12");
    c.setAttribute("ry", "4");
    c.setAttribute("fill", "none");
    c.setAttribute("stroke", color || "#3649b8");
    c.setAttribute("stroke-width", "2.2");
    c.setAttribute("opacity", "0.75");
    fxLayer.appendChild(c);

    const t0 = performance.now();
    function step(now) {
      const u = clamp((now - t0) / 520, 0, 1);
      c.setAttribute("rx", (12 + 68 * easeOutCubic(u)).toFixed(1));
      c.setAttribute("ry", (4 + 14 * easeOutCubic(u)).toFixed(1));
      c.setAttribute("opacity", (0.75 * (1 - u)).toFixed(2));
      if (u < 1) {
        requestAnimationFrame(step);
      } else if (c.parentNode) {
        c.parentNode.removeChild(c);
      }
    }
    requestAnimationFrame(step);
  }

  function renderAtTime(t) {
    const st = evaluateTimeline(t);
    const geom = buildCatGeometry(st);

    const primaryMode = currentStyle === "silhouette" ? "silhouette" : "outline";
    applyCatStyleToLayers(geom, primaryMode, pHalo, pFill, pHoles, pCreases);

    if (st.exactLock && primaryMode === "outline") {
      exactPdfPath.setAttribute("opacity", "1");
    } else {
      exactPdfPath.setAttribute("opacity", "0");
    }

    const anchorX = 330;
    const anchorY = 681;
    const sx = st.dir * st.scaleX * CAT_SCALE;
    const sy = st.scaleY * CAT_SCALE;

    catWorld.setAttribute("transform", "translate(" + st.x.toFixed(2) + "," + st.y.toFixed(2) + ") scale(" + sx.toFixed(4) + "," + sy.toFixed(4) + ")");
    catLocal.setAttribute("transform", "rotate(" + st.bodyRot.toFixed(2) + " 0 -130) translate(" + (-anchorX) + "," + (-anchorY) + ")");

    if (currentStyle === "both") {
      compGroup.style.display = "";
      applyCatStyleToLayers(geom, "silhouette", pHaloB, pFillB, pHolesB, pCreasesB);
      compGroup.setAttribute("transform", "translate(" + (st.x + 215).toFixed(2) + "," + st.y.toFixed(2) + ") scale(" + (sx * 0.88).toFixed(4) + "," + (sy * 0.88).toFixed(4) + ")");
      compLocal.setAttribute("transform", "rotate(" + st.bodyRot.toFixed(2) + " 0 -130) translate(" + (-anchorX) + "," + (-anchorY) + ")");
    } else {
      compGroup.style.display = "none";
    }

    const overShelf = st.x > 405 && st.x < 1135 && st.y <= Y_SHELF + 40;
    if (overShelf) {
      const h = Math.max(0, Y_SHELF - st.y);
      const shScale = clamp(1 - h / 220, 0.35, 1.0);
      shadowShelf.setAttribute("cx", st.x.toFixed(1));
      shadowShelf.setAttribute("rx", (84 * shScale).toFixed(1));
      shadowShelf.setAttribute("opacity", (0.85 * shScale).toFixed(2));
      shadowFloor.setAttribute("opacity", "0.12");
      shadowFloor.setAttribute("cx", st.x.toFixed(1));
    } else {
      const h = Math.max(0, Y_FLOOR - st.y);
      const flScale = clamp(1 - h / 280, 0.3, 1.0);
      shadowFloor.setAttribute("cx", st.x.toFixed(1));
      shadowFloor.setAttribute("rx", (84 * flScale).toFixed(1));
      shadowFloor.setAttribute("opacity", (0.9 * flScale).toFixed(2));
      shadowShelf.setAttribute("opacity", "0");
    }

    const band = Math.floor(t * 10);
    if (band !== lastTriggerBand) {
      lastTriggerBand = band;
      if (band === 30) spawnRipple(480, Y_SHELF, "#64748b");
      if (band === 37) spawnRipple(245, Y_FLOOR, "#3649b8");
      if (band === 61) spawnRipple(1165, Y_FLOOR, "#3649b8");
      if (band === 65) spawnRipple(960, Y_SHELF, "#3649b8");
    }

    if (currentCam === "closeup") {
      const camZoom = 1.72;
      const targetX = clamp(st.x, 260, 1180);
      const targetY = clamp(st.y - 110, 260, 560);
      const tx = 720 - targetX * camZoom;
      const ty = 400 - targetY * camZoom;
      cameraRig.setAttribute("transform", "translate(" + tx.toFixed(1) + "," + ty.toFixed(1) + ") scale(" + camZoom + ")");
    } else {
      cameraRig.setAttribute("transform", "");
    }

    if (phaseLabelEl) phaseLabelEl.textContent = st.phaseName;
    if (poseBadgeEl && st.exactLock) {
      poseBadgeEl.textContent = "PDF PATH LOCK: 100.0% (исходная поза 1:1)";
      poseBadgeEl.classList.add("is-locked");
    } else if (poseBadgeEl) {
      poseBadgeEl.textContent = "RIG ACTIVE · sit=" + st.sit.toFixed(2) + " · X=" + Math.round(st.x) + " Y=" + Math.round(st.y);
      poseBadgeEl.classList.remove("is-locked");
    }

    if (scrubberEl) scrubberEl.value = t.toFixed(2);
    if (timeReadoutEl) timeReadoutEl.textContent = t.toFixed(2) + "s / 10.80s";

    for (let i = 0; i < phaseStepBtns.length; i++) {
      phaseStepBtns[i].classList.toggle("is-active", i === st.phaseId);
    }
  }

  function tick(now) {
    const dt = Math.min(0.06, (now - lastNow) / 1000);
    lastNow = now;
    if (isPlaying) {
      animTime = (animTime + dt * speedMult) % 10.8;
      renderAtTime(animTime);
    }
    requestAnimationFrame(tick);
  }

  const playPauseBtn = document.getElementById("play-pause-btn");
  const playPauseLabel = document.getElementById("play-pause-label");
  const liveDot = document.getElementById("live-dot");

  function setPlaying(play) {
    isPlaying = play;
    if (playPauseLabel) playPauseLabel.textContent = isPlaying ? "Пауза" : "Пуск ▶";
    if (liveDot) liveDot.style.background = isPlaying ? "#10b981" : "#f59e0b";
  }

  if (playPauseBtn) playPauseBtn.addEventListener("click", function() {
    setPlaying(!isPlaying);
  });

  var repBtn = document.getElementById("replay-btn"); if (repBtn) repBtn.addEventListener("click", function() {
    animTime = 0.0;
    renderAtTime(0.0);
    setPlaying(true);
  });

  if (scrubberEl) scrubberEl.addEventListener("input", function() {
    setPlaying(false);
    animTime = parseFloat(scrubberEl.value) || 0;
    renderAtTime(animTime);
  });

  phaseStepBtns.forEach(function(btn) {
    btn.addEventListener("click", function() {
      animTime = parseFloat(btn.getAttribute("data-time")) || 0;
      renderAtTime(animTime);
    });
  });

  document.querySelectorAll("[data-style]").forEach(function(btn) {
    btn.addEventListener("click", function() {
      currentStyle = btn.getAttribute("data-style");
      document.querySelectorAll("[data-style]").forEach(function(b) {
        b.classList.toggle("is-active", b === btn);
      });
      document.body.classList.toggle("style-silhouette", currentStyle === "silhouette");
      renderAtTime(animTime);
    });
  });

  document.querySelectorAll("[data-cam]").forEach(function(btn) {
    btn.addEventListener("click", function() {
      currentCam = btn.getAttribute("data-cam");
      document.querySelectorAll("[data-cam]").forEach(function(b) {
        b.classList.toggle("is-active", b === btn);
      });
      renderAtTime(animTime);
    });
  });

  document.querySelectorAll("[data-speed]").forEach(function(btn) {
    btn.addEventListener("click", function() {
      speedMult = parseFloat(btn.getAttribute("data-speed")) || 1.0;
      document.querySelectorAll("[data-speed]").forEach(function(b) {
        b.classList.toggle("is-active", b === btn);
      });
    });
  });

  window.addEventListener("keydown", function(e) {
    if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
    if (e.code === "Space") {
      e.preventDefault();
      setPlaying(!isPlaying);
    } else if (e.key === "r" || e.key === "R" || e.key === "к" || e.key === "К") {
      animTime = 0;
      renderAtTime(0);
      setPlaying(true);
    } else if (e.code === "ArrowRight") {
      setPlaying(false);
      animTime = (animTime + 0.15) % 10.8;
      renderAtTime(animTime);
    } else if (e.code === "ArrowLeft") {
      setPlaying(false);
      animTime = (animTime - 0.15 + 10.8) % 10.8;
      renderAtTime(animTime);
    }
  });

  const rmQuery = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
  const rmBanner = document.getElementById("rm-banner");
  if (rmQuery && rmQuery.matches) {
    setPlaying(false);
    if (rmBanner) rmBanner.classList.add("is-visible");
  }
  var rmBtn = document.getElementById("rm-play-btn"); if (rmBtn) rmBtn.addEventListener("click", function() {
    rmBanner.classList.remove("is-visible");
    setPlaying(true);
  });

  function copyEmbedSnippet(btn) {
    const svgClone = document.getElementById("scene-svg").outerHTML;
    const oldText = btn.textContent;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(svgClone).then(function() {
        btn.textContent = "Скопировано ✓";
        setTimeout(function() { btn.textContent = oldText; }, 1800);
      });
    }
  }
  var cs1 = document.getElementById("copy-snippet-btn"); if (cs1) cs1.addEventListener("click", function() {
    copyEmbedSnippet(this);
  });
  var cs2 = document.getElementById("copy-snippet-btn-2"); if (cs2) cs2.addEventListener("click", function() {
    copyEmbedSnippet(this);
  });

  function triggerSelfDownload() {
    const html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    const blob = new Blob([html], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "cat-logo-animation.html";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 1500);
  }
  var dlBtn = document.getElementById("download-concept"); if (dlBtn) dlBtn.addEventListener("click", triggerSelfDownload);
  if (location.search.indexOf("download=1") !== -1) {
    setTimeout(triggerSelfDownload, 350);
  }

  renderAtTime(0.0);
  requestAnimationFrame(tick);
})();
</script>
</div>
